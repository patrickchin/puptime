name: Android disposable signing proof
run-name: NOT FOR RELEASE - Android signing proof
on:
  workflow_dispatch:
    inputs:
      expected_driver:
        description: Exact reviewed 40-character SHA of this workflow and driver
        type: string
        required: true
      expected_source:
        description: Exact reviewed 40-character app source SHA shared by both artifact-only runs
        type: string
        required: true
      bridge_run_id:
        description: Successful Android APK artifact-only run at version 1.12.6
        type: string
        required: true
      later_run_id:
        description: Successful Android APK artifact-only run at version 1.12.7
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: android-signing-proof-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUPTIME_EXPECTED_DRIVER: ${{ inputs.expected_driver }}
      PUPTIME_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      PUPTIME_BRIDGE_RUN: ${{ inputs.bridge_run_id }}
      PUPTIME_LATER_RUN: ${{ inputs.later_run_id }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Reserve a fresh private task path
        run: echo "PUPTIME_SIGNING_PRIVATE=$RUNNER_TEMP/puptime-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Static source checks (no keys or device)
        run: node scripts/verify-android-signing-upgrade.mjs --self-check
      - run: npm ci
      - name: Pin completed artifact-only runs and immutable APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-android-signing-upgrade.mjs --preflight
      - name: Prepare isolated Android tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_HOME"
          puptime_sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$puptime_sdkmanager"
          puptime_cmdline_bin=$(dirname "$puptime_sdkmanager")
          for puptime_tool in "$puptime_cmdline_bin/sdkmanager" "$puptime_cmdline_bin/avdmanager" "$ANDROID_HOME/platform-tools/adb"; do
            test -x "$puptime_tool"
            printf 'Android executable: %s\n' "$puptime_tool"
          done
          export PATH="$puptime_cmdline_bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          printf '%s\n' "$puptime_cmdline_bin" "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          timeout 30 sdkmanager --version | sed -n '1,4p'
          timeout 30 adb version | sed -n '1,4p'
          sdkmanager 'emulator' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
          dpkg-query -W libpulse0
          for puptime_properties in "$ANDROID_HOME/emulator/source.properties" "$ANDROID_HOME/build-tools/36.0.0/source.properties" "$ANDROID_HOME/system-images/android-36/google_apis/x86_64/source.properties"; do
            test -f "$puptime_properties"
            printf 'Android package metadata: %s\n' "$puptime_properties"
            awk '/^Pkg\.Revision[[:space:]]*=/ {revision=1} /^(Pkg\.(Desc|Revision|BuildId)|AndroidVersion\.ApiLevel)[[:space:]]*=/ && ++n<=4 {print} END {exit !revision}' "$puptime_properties"
          done
          test -x "$ANDROID_HOME/emulator/emulator"
          printf 'Android executable: %s\n' "$ANDROID_HOME/emulator/emulator"
          # The launcher may supply bundled SDK library paths; ldd is diagnostic only.
          puptime_dependency_report="$PUPTIME_SIGNING_PRIVATE/loader-dependencies.txt"
          : > "$puptime_dependency_report"
          puptime_loader_failed=0
          for puptime_binary in "$ANDROID_HOME/emulator/emulator" "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"; do
            printf 'Checking host dependencies: %s\n' "$puptime_binary"
            test -x "$puptime_binary"
            timeout 30 ldd "$puptime_binary" >> "$puptime_dependency_report" 2>&1 || puptime_loader_failed=1
          done
          puptime_missing_libraries=$(awk '$2=="=>" && $3=="not" && $4=="found" {print $1}' "$puptime_dependency_report" | sort -u)
          if [[ -n "$puptime_missing_libraries" || "$puptime_loader_failed" != 0 ]]; then
            printf 'Unresolved emulator ELF libraries (diagnostic; launcher may supply SDK paths):\n%s\n' "$puptime_missing_libraries"
            if [[ "$puptime_loader_failed" != 0 ]]; then
              printf 'ELF inspection diagnostic; launcher and boot checks remain mandatory:\n'
              sed -n '1,40p' "$puptime_dependency_report"
            fi
          fi
          timeout 30 emulator -version | sed -n '1,4p'
          export ANDROID_AVD_HOME="$PUPTIME_SIGNING_PRIVATE/avd"
          mkdir -m 700 "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-signing-qa.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          printf 'no\n' | avdmanager create avd --name "Puptime_Signing_QA_$GITHUB_RUN_ID" --package 'system-images;android-36;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd "Puptime_Signing_QA_$GITHUB_RUN_ID" -port 5588 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > "$PUPTIME_SIGNING_PRIVATE/emulator.log" 2>&1 &
          echo "$!" > "$PUPTIME_SIGNING_PRIVATE/emulator.pid"
          node scripts/verify-android-signing-upgrade.mjs --emulator-record
          node scripts/verify-android-signing-upgrade.mjs --emulator-root
          adb -s emulator-5588 shell svc wifi disable
          adb -s emulator-5588 shell svc data disable
          adb -s emulator-5588 shell cmd connectivity airplane-mode enable
          node scripts/verify-android-signing-upgrade.mjs --emulator-offline
      - name: Install the established Maestro version
        env:
          MAESTRO_VERSION: '2.11.0'
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Exercise guest-only signing transitions
        run: node scripts/verify-android-signing-upgrade.mjs --exercise
      - name: Restrict all task material before retention or cleanup
        if: always()
        shell: bash
        run: |
          if [[ -d "$PUPTIME_SIGNING_PRIVATE" && ! -L "$PUPTIME_SIGNING_PRIVATE" ]]; then
            find "$PUPTIME_SIGNING_PRIVATE" -type d -exec chmod 700 {} +
            find "$PUPTIME_SIGNING_PRIVATE" -type f -exec chmod 600 {} +
          fi
      - name: Remove owned emulator and private QA material
        if: always()
        run: |
          if [[ -f "$PUPTIME_SIGNING_PRIVATE/NOT-FOR-RELEASE" ]]; then
            node scripts/verify-android-signing-upgrade.mjs --emulator-cleanup
          fi
      - name: Preserve only allowlisted non-secret comparison receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-signing-safe-receipt
          path: |
            build/android-signing-safe/verification.json
            build/android-signing-safe/guest-seed-failure.png
          if-no-files-found: ignore
          retention-days: 7
