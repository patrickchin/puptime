name: Android disposable signing proof
run-name: NOT FOR RELEASE - Android signing proof
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact reviewed 40-character source SHA shared by this driver and both artifact-only runs
        type: string
        required: true
      bridge_run_id:
        description: Successful Android APK artifact-only run at version 1.12.6
        type: string
        required: true
      later_run_id:
        description: Successful Android APK artifact-only run at version 1.12.7
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: android-signing-proof-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUPTIME_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      PUPTIME_BRIDGE_RUN: ${{ inputs.bridge_run_id }}
      PUPTIME_LATER_RUN: ${{ inputs.later_run_id }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Reserve a fresh private task path
        run: echo "PUPTIME_SIGNING_PRIVATE=$RUNNER_TEMP/puptime-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Static source checks (no keys or device)
        run: node scripts/verify-android-signing-upgrade.mjs --self-check
      - name: Pin completed artifact-only runs and immutable APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-android-signing-upgrade.mjs --preflight
      - run: npm ci
      - name: Prepare isolated Android tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sdkmanager 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
          export ANDROID_AVD_HOME="$PUPTIME_SIGNING_PRIVATE/avd"
          mkdir -m 700 "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-signing-qa.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          printf 'no\n' | avdmanager create avd --name "Puptime_Signing_QA_$GITHUB_RUN_ID" --package 'system-images;android-36;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd "Puptime_Signing_QA_$GITHUB_RUN_ID" -port 5588 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > "$PUPTIME_SIGNING_PRIVATE/emulator.log" 2>&1 &
          echo "$!" > "$PUPTIME_SIGNING_PRIVATE/emulator.pid"
          timeout 180 adb -s emulator-5588 wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb -s emulator-5588 shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            if [[ "$attempt" = 90 ]]; then exit 1; fi
            sleep 2
          done
          test "$(adb -s emulator-5588 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5588 root
          timeout 60 adb -s emulator-5588 wait-for-device
          adb -s emulator-5588 shell svc wifi disable
          adb -s emulator-5588 shell svc data disable
          adb -s emulator-5588 shell cmd connectivity airplane-mode enable
      - name: Install the established Maestro version
        env:
          MAESTRO_VERSION: '2.11.0'
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Exercise guest-only signing transitions
        run: node scripts/verify-android-signing-upgrade.mjs --exercise
      - name: Restrict all task material before retention or cleanup
        if: always()
        shell: bash
        run: |
          if [[ -d "$PUPTIME_SIGNING_PRIVATE" && ! -L "$PUPTIME_SIGNING_PRIVATE" ]]; then
            find "$PUPTIME_SIGNING_PRIVATE" -type d -exec chmod 700 {} +
            find "$PUPTIME_SIGNING_PRIVATE" -type f -exec chmod 600 {} +
          fi
      - name: Preserve only allowlisted non-secret comparison receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-signing-safe-receipt
          path: build/android-signing-safe/verification.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove owned emulator and private QA material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$PUPTIME_SIGNING_PRIVATE/NOT-FOR-RELEASE" ]]; then
            test "$(cat "$PUPTIME_SIGNING_PRIVATE/NOT-FOR-RELEASE")" = "$PUPTIME_EXPECTED_SOURCE"
            if adb -s emulator-5588 emu avd name 2>/dev/null | grep -Fxq "Puptime_Signing_QA_$GITHUB_RUN_ID"; then
              adb -s emulator-5588 emu kill
            fi
            rm -rf -- "$PUPTIME_SIGNING_PRIVATE"
          fi
