name: Checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:ios
      - run: npm test
      - run: npm run test:web
      - run: npm run build:web
      - name: Install browser qualification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/puptime-playwright" --no-save --package-lock=false playwright@1.65.0
          node "$RUNNER_TEMP/puptime-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Qualify puppy sharing in Chromium
        run: npm run test:e2e:sharing:web
        env:
          PUPTIME_PLAYWRIGHT_MODULE: ${{ runner.temp }}/puptime-playwright/node_modules/playwright
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: puppy-sharing-browser
          path: ~/Pictures/Screenshots/Codex/puptime-sharing-2c13/web/
          if-no-files-found: ignore
      - run: npm run typecheck:server
      - run: npm run test:server
      - run: npx expo export --platform android --output-dir dist-android
      - run: npx expo export --platform ios --output-dir dist-ios
