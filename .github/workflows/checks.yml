name: Checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node --test scripts/native-task-cleanup.test.mjs scripts/native-rich-state.test.mjs scripts/native-command-evidence.test.mjs scripts/native-startup-evidence.test.mjs scripts/native-account-evidence.test.mjs scripts/native-standard-suite.test.mjs scripts/native-font-notice-evidence.test.mjs
      - run: node --test scripts/native-host-policy.test.mjs
      - run: npm run typecheck
      - run: npm run typecheck:ios
      - run: npm test
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run typecheck:server
      - run: npm run test:server
      - run: npx expo export --platform android --output-dir dist-android
      - run: npx expo export --platform ios --output-dir dist-ios
