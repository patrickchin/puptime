name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version (for example 1.12.0); leave blank for the next patch
        required: false
        type: string
      signing:
        description: QA template or proposed beta upload signer (never publishes)
        type: choice
        options: [qa-template, beta-upload]
        default: qa-template
      expected_source:
        description: Exact reviewed main SHA required for beta-upload
        type: string
        required: false
      publish:
        description: Publish a GitHub release and create its tag if needed
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: puptime-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Configure this environment to admit main only and require owner approval
    # BEFORE adding its signing secrets. QA has no signing credentials.
    environment: ${{ inputs.signing == 'beta-upload' && 'android-beta-signing' || 'android-qa' }}
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_CLOUD_API_URL: https://puptime.pages.dev
      EXPO_PUBLIC_CLOUD_ALLOW_LOCAL: "0"
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      base_tag: ${{ steps.release.outputs.base_tag }}
      apk_sha256: ${{ steps.verify.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep template QA artifacts out of public releases
        if: ${{ inputs.signing != 'beta-upload' }}
        env:
          PUPTIME_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUPTIME_PUBLISH" == true ]]; then
            echo 'Template-signed QA artifacts cannot be published as a release. Qualify the intended delivery and signing first.' >&2
            exit 1
          fi
      - name: Admit exact beta source before accessing signing credentials
        if: ${{ inputs.signing == 'beta-upload' }}
        env:
          PUPTIME_EXPECTED_SOURCE: ${{ inputs.expected_source }}
          PUPTIME_PUBLISH: ${{ inputs.publish }}
          PUPTIME_UPLOAD_CERT_SHA256: ${{ vars.PUPTIME_UPLOAD_CERT_SHA256 }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$PUPTIME_EXPECTED_SOURCE" = "$GITHUB_SHA"
          test "$PUPTIME_PUBLISH" = false
          if [[ ! "$PUPTIME_UPLOAD_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            exit 1
          fi
          test "$PUPTIME_UPLOAD_CERT_SHA256" != fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
      - name: Choose release version
        id: release
        shell: bash
        env:
          PUPTIME_REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            base_tag=""
          else
            base_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD)
            if [[ ! "$base_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Unsupported release tag: $base_tag" >&2
              exit 1
            fi
            if [[ -n "$PUPTIME_REQUESTED_VERSION" ]]; then
              tag="v$PUPTIME_REQUESTED_VERSION"
            else
              tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            fi
          fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "base_tag=$base_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Set artifact version
        env:
          PUPTIME_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const config = require('./app.json');
          const [major, minor, patch] = process.env.PUPTIME_VERSION.split('.').map(Number);
          config.expo.version = process.env.PUPTIME_VERSION;
          config.expo.android.versionCode = major * 1000000 + minor * 1000 + patch;
          fs.writeFileSync('app.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - name: Build QA artifacts with the existing template signer
        if: ${{ inputs.signing != 'beta-upload' }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          EXPO_PUBLIC_APP_POSTHOG_KEY: ${{ vars.EXPO_PUBLIC_APP_POSTHOG_KEY }}
          EXPO_PUBLIC_APP_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_APP_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        working-directory: android
      - name: Build proposed beta artifacts with private upload credentials
        if: ${{ inputs.signing == 'beta-upload' }}
        shell: bash
        env:
          PUPTIME_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PUPTIME_UPLOAD_KEYSTORE_BASE64 }}
          PUPTIME_UPLOAD_STORE_PASSWORD: ${{ secrets.PUPTIME_UPLOAD_STORE_PASSWORD }}
          PUPTIME_UPLOAD_KEY_PASSWORD: ${{ secrets.PUPTIME_UPLOAD_KEY_PASSWORD }}
          PUPTIME_UPLOAD_KEY_ALIAS: ${{ secrets.PUPTIME_UPLOAD_KEY_ALIAS }}
          EXPO_PUBLIC_APP_POSTHOG_KEY: ${{ vars.EXPO_PUBLIC_APP_POSTHOG_KEY }}
          EXPO_PUBLIC_APP_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_APP_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: |
          set -euo pipefail
          umask 077
          puptime_private="$RUNNER_TEMP/puptime-beta-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$puptime_private"
          trap 'rm -rf -- "$puptime_private"' EXIT
          export PUPTIME_UPLOAD_STORE_FILE="$puptime_private/upload.p12"
          test -n "$PUPTIME_UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$PUPTIME_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$PUPTIME_UPLOAD_STORE_FILE"
          unset PUPTIME_UPLOAD_KEYSTORE_BASE64
          printf '\napply from: rootProject.file("../scripts/android-beta-signing.gradle")\n' >> android/app/build.gradle
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon --no-configuration-cache --no-build-cache
      - name: Remove private signing material after success, failure or cancellation
        if: ${{ always() && inputs.signing == 'beta-upload' }}
        shell: bash
        run: |
          set -euo pipefail
          puptime_private="$RUNNER_TEMP/puptime-beta-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$puptime_private"
          test ! -e "$puptime_private"
      - name: Verify artifacts and record qualification metadata
        id: verify
        shell: bash
        run: |
          mkdir qualification
          puptime_apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$puptime_apksigner"
          "$puptime_apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee qualification/APK-SIGNING.txt
          unzip -tq android/app/build/outputs/apk/release/app-release.apk
          unzip -tq android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > qualification/AAB-SIGNATURE-VERIFICATION.txt
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab > qualification/AAB-SIGNING.txt
          keytool -printcert -rfc -jarfile android/app/build/outputs/bundle/release/app-release.aab > qualification/AAB-CERTIFICATE.pem
          grep -q -- '-----BEGIN CERTIFICATE-----' qualification/AAB-CERTIFICATE.pem
          puptime_apkanalyzer=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)
          test -n "$puptime_apkanalyzer"
          "$puptime_apkanalyzer" manifest print android/app/build/outputs/apk/release/app-release.apk > qualification/APK-MANIFEST.xml
          unzip -p android/app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml > qualification/AAB-MANIFEST.pb
          test -s qualification/AAB-MANIFEST.pb
          python3 scripts/check-store-audio.py android/app/build/outputs/apk/release/app-release.apk
          python3 scripts/check-store-audio.py android/app/build/outputs/bundle/release/app-release.aab
          (cd android/app/build/outputs/apk/release && sha256sum app-release.apk) > qualification/SHA256SUMS.txt
          (cd android/app/build/outputs/bundle/release && sha256sum app-release.aab) >> qualification/SHA256SUMS.txt
          echo "apk_sha256=$(sha256sum android/app/build/outputs/apk/release/app-release.apk | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const fs = require('node:fs');
          const {expo} = require('./app.json');
          fs.writeFileSync('qualification/BUILD-INFO.json', JSON.stringify({
            sourceCommit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            configuredPackage: expo.android.package,
            configuredVersion: expo.version,
            configuredVersionCode: expo.android.versionCode,
          }, null, 2) + '\n');
          NODE
      - name: Require the approved upload certificate on both beta artifacts
        if: ${{ inputs.signing == 'beta-upload' }}
        env:
          PUPTIME_UPLOAD_CERT_SHA256: ${{ vars.PUPTIME_UPLOAD_CERT_SHA256 }}
        run: python3 scripts/verify-android-beta-signing.py
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-android-qualification
          path: qualification/
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: puptime-android-apk
          path: release
      - name: Prepare release files
        env:
          PUPTIME_APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          PUPTIME_VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf '%s  %s\n' "$PUPTIME_APK_SHA256" release/app-release.apk | sha256sum --check -
          mv release/app-release.apk "release/Puptime-${PUPTIME_VERSION}.apk"
          cd release
          sha256sum "Puptime-${PUPTIME_VERSION}.apk" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUPTIME_BASE_TAG: ${{ needs.build.outputs.base_tag }}
          PUPTIME_RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PUPTIME_VERSION: ${{ needs.build.outputs.version }}
          PUPTIME_BUILD_COMMIT: ${{ github.sha }}
        run: |
          # Create only; an existing ref must fail instead of silently reusing
          # a tag from a different source. Never move or overwrite release tags.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$PUPTIME_RELEASE_TAG" \
            -f "sha=$PUPTIME_BUILD_COMMIT" > /dev/null
          puptime_notes=()
          if [[ -n "$PUPTIME_BASE_TAG" ]]; then
            puptime_notes=(--notes-start-tag "$PUPTIME_BASE_TAG")
          fi
          gh release create "$PUPTIME_RELEASE_TAG" \
            "release/Puptime-${PUPTIME_VERSION}.apk#Puptime-${PUPTIME_VERSION}.apk" \
            "release/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Puptime $PUPTIME_RELEASE_TAG" \
            --generate-notes "${puptime_notes[@]}"
