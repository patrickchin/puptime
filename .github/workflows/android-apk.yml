name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Must match committed app.json; blank uses its version
        required: false
        type: string
      publish:
        description: Publish a GitHub release and create its tag if needed
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: puptime-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_POSTHOG_KEY: ${{ vars.EXPO_PUBLIC_APP_POSTHOG_KEY }}
      EXPO_PUBLIC_APP_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_APP_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      base_tag: ${{ steps.release.outputs.base_tag }}
      apk_sha256: ${{ steps.verify.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Validate committed candidate version
        id: release
        env:
          PUPTIME_REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const {expo} = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const match = /^([0-9]+)\.([0-9]+)\.([0-9]+)$/.exec(expo.version);
          assert.ok(match, 'Commit a valid candidate version before building.');
          const [major, minor, patch] = match.slice(1).map(Number);
          const code = major * 1000000 + minor * 1000 + patch;
          assert.ok(Number.isSafeInteger(code) && code > 0 && expo.android.versionCode === code,
            'Commit the matching Android versionCode before building.');
          const requested = (process.env.PUPTIME_REQUESTED_VERSION || '').trim();
          assert.ok(!requested || requested === expo.version, 'Requested version must equal committed app.json.');
          const tag = 'v' + expo.version;
          const isTag = process.env.GITHUB_REF_TYPE === 'tag';
          assert.ok(!isTag || process.env.GITHUB_REF_NAME === tag, 'Tag must equal committed app.json.');
          execFileSync('git', ['diff', '--quiet', 'HEAD', '--'], {stdio: 'pipe'});
          const base = isTag ? '' : execFileSync('git',
            ['describe', '--tags', '--abbrev=0', '--match', 'v[0-9]*.[0-9]*.[0-9]*', 'HEAD'],
            {encoding: 'utf8'}).trim();
          assert.ok(!base || /^v[0-9]+\.[0-9]+\.[0-9]+$/.test(base), 'Invalid previous release tag.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'tag=' + tag + '\nversion=' + expo.version + '\nbase_tag=' + base + '\n');
          NODE
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - name: Resolve notice inputs and seal committed candidate
        run: |
          umask 077
          mkdir -p build/notices/android/private
          (cd android && ./gradlew -I ../scripts/notices-runtime.init.gradle \
            :app:writeNoticeRuntimeInputs --no-daemon \
            -PnoticeMainProjectRoot="$PWD" \
            -PnoticeInputsOutput="$PWD/../build/notices/android/private/runtime-inputs.json")
          node scripts/capture-app-notices.mjs seal android \
            --gradle-input build/notices/android/private/runtime-inputs.json
      - run: ./gradlew assembleRelease bundleRelease --no-daemon
        working-directory: android
      - name: Verify exact packaged notices and mapped build outputs
        run: |
          node scripts/capture-app-notices.mjs verify android \
            --gradle-input build/notices/android/private/runtime-inputs.json \
            --archive android/app/build/outputs/apk/release/app-release.apk \
            --bundle android/app/build/generated/assets/react/release/index.android.bundle \
            --source-map android/app/build/generated/sourcemaps/react/release/index.android.bundle.map
          node scripts/capture-app-notices.mjs verify android \
            --gradle-input build/notices/android/private/runtime-inputs.json \
            --archive android/app/build/outputs/bundle/release/app-release.aab \
            --bundle android/app/build/generated/assets/react/release/index.android.bundle \
            --source-map android/app/build/generated/sourcemaps/react/release/index.android.bundle.map
      - name: Verify artifacts and record qualification metadata
        id: verify
        shell: bash
        run: |
          mkdir qualification
          cp build/notices/android/seal.json qualification/NOTICE-SEAL.json
          cp build/notices/android/final-apk.json qualification/NOTICE-APK.json
          cp build/notices/android/final-aab.json qualification/NOTICE-AAB.json
          puptime_apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$puptime_apksigner"
          "$puptime_apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee qualification/APK-SIGNING.txt
          unzip -tq android/app/build/outputs/apk/release/app-release.apk
          unzip -tq android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > qualification/AAB-SIGNATURE-VERIFICATION.txt
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab > qualification/AAB-SIGNING.txt
          keytool -printcert -rfc -jarfile android/app/build/outputs/bundle/release/app-release.aab > qualification/AAB-CERTIFICATE.pem
          grep -q -- '-----BEGIN CERTIFICATE-----' qualification/AAB-CERTIFICATE.pem
          puptime_apkanalyzer=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)
          test -n "$puptime_apkanalyzer"
          "$puptime_apkanalyzer" manifest print android/app/build/outputs/apk/release/app-release.apk > qualification/APK-MANIFEST.xml
          unzip -p android/app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml > qualification/AAB-MANIFEST.pb
          test -s qualification/AAB-MANIFEST.pb
          python3 scripts/check-store-audio.py android/app/build/outputs/apk/release/app-release.apk
          python3 scripts/check-store-audio.py android/app/build/outputs/bundle/release/app-release.aab
          (cd android/app/build/outputs/apk/release && sha256sum app-release.apk) > qualification/SHA256SUMS.txt
          (cd android/app/build/outputs/bundle/release && sha256sum app-release.aab) >> qualification/SHA256SUMS.txt
          echo "apk_sha256=$(sha256sum android/app/build/outputs/apk/release/app-release.apk | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const fs = require('node:fs');
          const {expo} = require('./app.json');
          fs.writeFileSync('qualification/BUILD-INFO.json', JSON.stringify({
            sourceCommit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            configuredPackage: expo.android.package,
            configuredVersion: expo.version,
            configuredVersionCode: expo.android.versionCode,
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-android-qualification
          path: qualification/
          if-no-files-found: error

      - name: Upload unreviewed public notice inputs (INCOMPLETE)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unreviewed-oss-notice-inputs-android
          path: build/notices/android/review/unreviewed-oss-notice-inputs.json
          if-no-files-found: warn
          retention-days: 3

      - name: Upload discovery metadata (INCOMPLETE)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: notice-discovery-metadata-android-INCOMPLETE
          path: |
            build/notices/android/discovery.json
            build/notices/android/failure.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: puptime-android-apk
          path: release
      - name: Prepare release files
        env:
          PUPTIME_APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          PUPTIME_VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf '%s  %s\n' "$PUPTIME_APK_SHA256" release/app-release.apk | sha256sum --check -
          mv release/app-release.apk "release/Puptime-${PUPTIME_VERSION}.apk"
          cd release
          sha256sum "Puptime-${PUPTIME_VERSION}.apk" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUPTIME_BASE_TAG: ${{ needs.build.outputs.base_tag }}
          PUPTIME_RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PUPTIME_VERSION: ${{ needs.build.outputs.version }}
          PUPTIME_BUILD_COMMIT: ${{ github.sha }}
        run: |
          # Create only; an existing ref must fail instead of silently reusing
          # a tag from a different source. Never move or overwrite release tags.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$PUPTIME_RELEASE_TAG" \
            -f "sha=$PUPTIME_BUILD_COMMIT" > /dev/null
          puptime_notes=()
          if [[ -n "$PUPTIME_BASE_TAG" ]]; then
            puptime_notes=(--notes-start-tag "$PUPTIME_BASE_TAG")
          fi
          gh release create "$PUPTIME_RELEASE_TAG" \
            "release/Puptime-${PUPTIME_VERSION}.apk#Puptime-${PUPTIME_VERSION}.apk" \
            "release/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Puptime $PUPTIME_RELEASE_TAG" \
            --generate-notes "${puptime_notes[@]}"
