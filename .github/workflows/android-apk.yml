name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Verify APK signature and archive
        run: |
          puptime_apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$puptime_apksigner"
          "$puptime_apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          unzip -tq android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
