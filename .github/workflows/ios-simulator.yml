name: iOS Simulator

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Test transactional storage
        run: npm test
      - run: npx expo prebuild --platform ios --no-install
        env:
          CI: "1"
      - run: pod install --project-directory=ios
      - name: Build app and widget for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/Puptime.xcworkspace \
            -scheme Puptime \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            build
          test -d build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app \
            build/Puptime-iOS-Simulator.zip
          unzip -tq build/Puptime-iOS-Simulator.zip
      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.11.0"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run Maestro end-to-end tests
        timeout-minutes: 45
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
        run: |
          runtime_id=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains("iOS-26")))][-1].identifier // empty')
          test -n "$runtime_id"
          iphone_id=$(xcrun simctl create "Puptime CI $GITHUB_RUN_ID" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime_id")
          trap 'xcrun simctl delete "$iphone_id" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$iphone_id"
          xcrun simctl bootstatus "$iphone_id" -b
          xcrun simctl install "$iphone_id" build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
          maestro test \
            --platform ios \
            --device "$iphone_id" \
            --config .maestro/config.yaml \
            --format JUNIT \
            --output build/maestro-report.xml \
            --test-output-dir build/maestro-results \
            .maestro
      - name: Run conversational onboarding into the real app
        timeout-minutes: 15
        env:
          CI: "1"
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
        run: |
          mkdir -p build/onboarding-ci
          ditto build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app build/onboarding-ci/Puptime.app
          node node_modules/expo/bin/cli export:embed \
            --entry-file index.onboarding-preview.tsx --platform ios --dev false \
            --bytecode --max-workers 2 \
            --bundle-output build/onboarding-ci/Puptime.app/main.jsbundle \
            --assets-dest build/onboarding-ci/Puptime.app
          codesign --force --deep --sign - build/onboarding-ci/Puptime.app
          runtime_id=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains("iOS-26")))][-1].identifier // empty')
          test -n "$runtime_id"
          onboarding_device=$(xcrun simctl create "Puptime Onboarding CI $GITHUB_RUN_ID" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime_id")
          trap 'xcrun simctl delete "$onboarding_device" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$onboarding_device"
          xcrun simctl bootstatus "$onboarding_device" -b
          xcrun simctl install "$onboarding_device" build/onboarding-ci/Puptime.app
          maestro test \
            --platform ios --device "$onboarding_device" \
            --format JUNIT --output build/onboarding-maestro-report.xml \
            --test-output-dir build/onboarding-maestro-results \
            .maestro/conversational
      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: puptime-ios-maestro-results
          path: |
            build/maestro-report.xml
            build/maestro-results
            build/onboarding-maestro-report.xml
            build/onboarding-maestro-results
          if-no-files-found: warn
          retention-days: 7
      - name: Capture App Store screenshots
        timeout-minutes: 20
        run: |
          runtime_id=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains("iOS-26")))][-1].identifier // empty')
          ipad_type=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name == "iPad Pro 13-inch (M4)")][0].identifier // empty')
          test -n "$runtime_id"
          test -n "$ipad_type"
          iphone_id=$(xcrun simctl create "Puptime CI Photos $GITHUB_RUN_ID" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$runtime_id")
          ipad_id=$(xcrun simctl create "Puptime CI Tablet $GITHUB_RUN_ID" "$ipad_type" "$runtime_id")
          trap 'xcrun simctl delete "$iphone_id" >/dev/null 2>&1 || true; xcrun simctl delete "$ipad_id" >/dev/null 2>&1 || true' EXIT

          capture_screenshot() {
            device_id="$1"
            output_path="$2"
            xcrun simctl boot "$device_id" 2>/dev/null || true
            xcrun simctl bootstatus "$device_id" -b
            xcrun simctl install "$device_id" build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
            xcrun simctl launch "$device_id" com.patrickchin.puptime | grep -E '^com\.patrickchin\.puptime: [0-9]+$'
            sleep 5
            xcrun simctl io "$device_id" screenshot "$output_path"
            file "$output_path" | grep 'PNG image data'
            xcrun simctl shutdown "$device_id"
          }

          capture_screenshot "$iphone_id" build/Puptime-iPhone.png
          capture_screenshot "$ipad_id" build/Puptime-iPad.png
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-ios-simulator
          path: build/Puptime-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-app-store-screenshots
          path: |
            build/Puptime-iPhone.png
            build/Puptime-iPad.png
          if-no-files-found: error
          retention-days: 7
