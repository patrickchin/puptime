name: iOS Simulator

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
        env:
          CI: "1"
      - run: pod install --project-directory=ios
      - name: Build app and widget for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/Puptime.xcworkspace \
            -scheme Puptime \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app \
            build/Puptime-iOS-Simulator.zip
          unzip -tq build/Puptime-iOS-Simulator.zip
      - name: Capture App Store screenshots
        timeout-minutes: 12
        run: |
          devices=$(xcrun simctl list devices available -j)
          iphone_id=$(printf '%s' "$devices" | jq -r '[.devices[][] | select(.name | test("iPhone.*(Pro Max|Plus)"))][0].udid // [.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          ipad_id=$(printf '%s' "$devices" | jq -r '[.devices[][] | select(.name | test("iPad Pro.*(13-inch|12.9-inch)"))][0].udid // [.devices[][] | select(.name | startswith("iPad"))][0].udid // empty')
          test -n "$iphone_id"
          test -n "$ipad_id"

          for device_id in "$iphone_id" "$ipad_id"; do
            xcrun simctl boot "$device_id" 2>/dev/null || true
            xcrun simctl bootstatus "$device_id" -b
            xcrun simctl install "$device_id" build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
            xcrun simctl launch "$device_id" com.patrickchin.puptime | grep -E '^com\.patrickchin\.puptime: [0-9]+$'
          done

          sleep 5
          xcrun simctl io "$iphone_id" screenshot build/Puptime-iPhone.png
          xcrun simctl io "$ipad_id" screenshot build/Puptime-iPad.png
          xcrun simctl shutdown "$iphone_id"
          xcrun simctl shutdown "$ipad_id"
          file build/Puptime-iPhone.png | grep 'PNG image data'
          file build/Puptime-iPad.png | grep 'PNG image data'
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-ios-simulator
          path: build/Puptime-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-app-store-screenshots
          path: |
            build/Puptime-iPhone.png
            build/Puptime-iPad.png
          if-no-files-found: error
          retention-days: 7
