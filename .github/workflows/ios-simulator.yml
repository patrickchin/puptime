name: iOS Simulator

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
        env:
          CI: "1"
      - run: pod install --project-directory=ios
      - name: Build app and widget for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/Puptime.xcworkspace \
            -scheme Puptime \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app \
            build/Puptime-iOS-Simulator.zip
          unzip -tq build/Puptime-iOS-Simulator.zip
      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.8.0"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run Maestro end-to-end tests
        timeout-minutes: 35
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          devices=$(xcrun simctl list devices available -j)
          iphone_id=$(printf '%s' "$devices" | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | test("iPhone.*Pro$"))][0].udid // [.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          test -n "$iphone_id"
          trap 'xcrun simctl shutdown "$iphone_id" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$iphone_id" 2>/dev/null || true
          xcrun simctl bootstatus "$iphone_id" -b
          xcrun simctl install "$iphone_id" build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
          xcrun simctl launch "$iphone_id" com.patrickchin.puptime >/dev/null
          sleep 5
          xcrun simctl terminate "$iphone_id" com.patrickchin.puptime
          group_container=$(xcrun simctl get_app_container "$iphone_id" com.patrickchin.puptime group.com.patrickchin.puptime 2>/dev/null || true)
          widget_defaults="$group_container/Library/Preferences/group.com.patrickchin.puptime.plist"
          if [ ! -f "$widget_defaults" ]; then
            app_data=$(xcrun simctl get_app_container "$iphone_id" com.patrickchin.puptime data)
            widget_defaults="$app_data/Library/Preferences/group.com.patrickchin.puptime.plist"
          fi
          swift scripts/verify-ios-widget.swift \
            "$widget_defaults" \
            build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app/PlugIns/ExpoWidgetsTarget.appex/ExpoWidgets.bundle/ExpoWidgets.bundle
          maestro test \
            --platform ios \
            --device "$iphone_id" \
            --config .maestro/config.yaml \
            --format JUNIT \
            --output build/maestro-report.xml \
            --test-output-dir build/maestro-results \
            .maestro
      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: puptime-ios-maestro-results
          path: |
            build/maestro-report.xml
            build/maestro-results
          if-no-files-found: warn
          retention-days: 7
      - name: Capture App Store screenshots
        timeout-minutes: 20
        run: |
          devices=$(xcrun simctl list devices available -j)
          iphone_id=$(printf '%s' "$devices" | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | test("iPhone.*(Pro Max|Plus)"))][0].udid // [.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          ipad_id=$(printf '%s' "$devices" | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | test("iPad Pro.*(13-inch|12.9-inch)"))][0].udid // [.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | startswith("iPad"))][0].udid // empty')
          test -n "$iphone_id"
          test -n "$ipad_id"
          trap 'xcrun simctl shutdown "$iphone_id" >/dev/null 2>&1 || true; xcrun simctl shutdown "$ipad_id" >/dev/null 2>&1 || true' EXIT

          capture_screenshot() {
            device_id="$1"
            output_path="$2"
            xcrun simctl boot "$device_id" 2>/dev/null || true
            xcrun simctl bootstatus "$device_id" -b
            xcrun simctl install "$device_id" build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
            xcrun simctl launch "$device_id" com.patrickchin.puptime | grep -E '^com\.patrickchin\.puptime: [0-9]+$'
            sleep 5
            xcrun simctl io "$device_id" screenshot "$output_path"
            file "$output_path" | grep 'PNG image data'
            xcrun simctl shutdown "$device_id"
          }

          capture_screenshot "$iphone_id" build/Puptime-iPhone.png
          capture_screenshot "$ipad_id" build/Puptime-iPad.png
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-ios-simulator
          path: build/Puptime-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-app-store-screenshots
          path: |
            build/Puptime-iPhone.png
            build/Puptime-iPad.png
          if-no-files-found: error
          retention-days: 7
