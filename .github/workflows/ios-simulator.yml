name: iOS Simulator

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
        env:
          CI: "1"
      - run: pod install --project-directory=ios
      - name: Build app and widget for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/Puptime.xcworkspace \
            -scheme Puptime \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app \
            build/Puptime-iOS-Simulator.zip
          unzip -tq build/Puptime-iOS-Simulator.zip
      - name: Install and launch in iOS Simulator
        timeout-minutes: 6
        run: |
          device_id=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          test -n "$device_id"
          trap 'xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" build/ios-simulator/Build/Products/Release-iphonesimulator/Puptime.app
          xcrun simctl launch "$device_id" com.patrickchin.puptime | grep -E '^com\.patrickchin\.puptime: [0-9]+$'
          sleep 5
          xcrun simctl io "$device_id" screenshot build/Puptime-iOS-Simulator.png
          file build/Puptime-iOS-Simulator.png | grep 'PNG image data'
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-ios-simulator
          path: build/Puptime-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: puptime-ios-smoke-screenshot
          path: build/Puptime-iOS-Simulator.png
          if-no-files-found: error
          retention-days: 7
