name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android APK workflow run ID
        required: true
        type: string
      tag:
        description: Existing release tag (for example v1.3.0)
        required: true
        type: string
      notes:
        description: Release notes
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PUPTIME_RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$PUPTIME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name puptime-android-apk --dir release
      - name: Verify and name release files
        env:
          PUPTIME_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -f release/app-release.apk
          unzip -tq release/app-release.apk
          puptime_version="${PUPTIME_RELEASE_TAG#v}"
          mv release/app-release.apk "release/Puptime-${puptime_version}.apk"
          cd release
          sha256sum "Puptime-${puptime_version}.apk" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUPTIME_RELEASE_NOTES: ${{ inputs.notes }}
          PUPTIME_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          puptime_version="${PUPTIME_RELEASE_TAG#v}"
          gh release create "$PUPTIME_RELEASE_TAG" \
            "release/Puptime-${puptime_version}.apk#Puptime-${puptime_version}.apk" \
            "release/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Puptime ${PUPTIME_RELEASE_TAG}" \
            --notes "$PUPTIME_RELEASE_NOTES"
