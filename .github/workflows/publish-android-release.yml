name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Reviewed successful artifact-only Android APK run ID
        required: true
        type: string
      run_attempt:
        description: Exact reviewed run attempt (must still be current)
        required: true
        type: string
      source_commit:
        description: Exact reviewed 40-character build source SHA
        required: true
        type: string
      tag:
        description: Existing release tag resolving to that source (for example v1.12.6)
        required: true
        type: string
      apk_artifact_id:
        description: Exact reviewed puptime-android-apk artifact ID
        required: true
        type: string
      apk_artifact_sha256:
        description: Reviewed whole APK artifact ZIP SHA-256 (64 lowercase hex)
        required: true
        type: string
      qualification_artifact_id:
        description: Exact reviewed puptime-android-qualification artifact ID
        required: true
        type: string
      qualification_artifact_sha256:
        description: Reviewed whole qualification ZIP SHA-256 (64 lowercase hex)
        required: true
        type: string
      apk_sha256:
        description: Reviewed APK file SHA-256 (64 lowercase hex)
        required: true
        type: string
      notes:
        description: Release notes
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: puptime-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify pinned custody and publish existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          PUPTIME_RUN_ID: ${{ inputs.run_id }}
          PUPTIME_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          PUPTIME_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PUPTIME_TAG: ${{ inputs.tag }}
          PUPTIME_APK_ARTIFACT_ID: ${{ inputs.apk_artifact_id }}
          PUPTIME_APK_ARTIFACT_SHA256: ${{ inputs.apk_artifact_sha256 }}
          PUPTIME_QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          PUPTIME_QUALIFICATION_ARTIFACT_SHA256: ${{ inputs.qualification_artifact_sha256 }}
          PUPTIME_APK_SHA256: ${{ inputs.apk_sha256 }}
          PUPTIME_RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 scripts/publish-android-release.py
