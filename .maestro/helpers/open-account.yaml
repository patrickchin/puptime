appId: com.patrickchin.puptime
---
- extendedWaitUntil:
    visible:
      id: 'screen\.(today|settings|account)'
    timeout: 90000
- runFlow:
    when:
      notVisible:
        id: screen.account
    commands:
      - runFlow:
          when:
            visible:
              id: screen.today
          commands:
            - scrollUntilVisible:
                element:
                  id: nav.open
                direction: UP
                visibilityPercentage: 100
            - tapOn:
                id: nav.open
            - tapOn:
                id: nav.settings
      - runFlow:
          when:
            visible:
              id: screen.settings
          commands:
            - tapOn:
                id: settings.account.open
- extendedWaitUntil:
    visible:
      id: screen.account
    timeout: 30000
