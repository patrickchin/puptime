appId: com.patrickchin.puptime
---
# One tap per transition; require its exact destination before another action.
- extendedWaitUntil:
    visible:
      id: ^onboarding\.step\.${FROM_STEP}$
    timeout: 15000
- scrollUntilVisible:
    element:
      id: onboarding.primary
    direction: DOWN
    visibilityPercentage: 100
    waitToSettleTimeoutMs: 1000
    centerElement: false
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: onboarding.primary
      enabled: true
    timeout: 15000
- tapOn:
    id: onboarding.primary
    retryTapIfNoChange: false
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: ^${TO_ID}$
    timeout: 15000
