appId: com.patrickchin.puptime
name: Complete conversational setup into the real app
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible:
      id: preview.guest
    timeout: 90000
- takeScreenshot: conversational-welcome
- tapOn:
    id: preview.guest
- takeScreenshot: conversational-profile
- tapOn:
    id: preview.name
- runFlow:
    when:
      visible: Try out your stylus
    commands:
      - tapOn: Cancel
- inputText: Biscuit
- takeScreenshot: conversational-name-keyboard
- tapOn:
    id: preview.continue
- assertNotVisible: Optional
- takeScreenshot: conversational-age
- tapOn:
    id: preview.choice.middle
- takeScreenshot: conversational-meal-count
- tapOn:
    id: preview.choice.meals-3
- assertVisible:
    id: preview.mealTime.0
- assertVisible:
    id: preview.mealTime.1
- assertVisible:
    id: preview.mealTime.2
- assertNotVisible:
    id: preview.mealTime.3
- takeScreenshot: conversational-grouped-meals
- tapOn:
    id: preview.mealTime.0
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: time.nativeWheel
      - assertNotVisible:
          id: time.mode
      - tapOn:
          id: time.nativeWheel
          point: "28%,64%"
      - assertVisible: "8 o.clock"
      - takeScreenshot: conversational-native-time-wheel
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: time.wheel.hour
          point: "50%,70%"
      - takeScreenshot: conversational-android-time-wheel
- tapOn:
    id: picker.done
- tapOn:
    id: preview.back
- tapOn:
    id: preview.choice.meals-3
- assertVisible:
    id: preview.mealTime.0
    text: '.*8:00.*'
- tapOn:
    id: preview.continue
- assertVisible:
    id: preview.poopMealTime.0
    text: '.*Meal 1.*8:00.*'
- assertVisible:
    id: preview.poopMealTime.1
    text: '.*Meal 2.*12:00.*'
- assertVisible:
    id: preview.poopTime.0
    text: '.*8:30.*9:00.*'
- assertVisible:
    id: preview.poopTime.1
    text: '.*12:30.*1:00.*'
- takeScreenshot: conversational-poop-windows
- tapOn:
    id: preview.poopTime.0
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: time.nativeWheel
          point: "28%,64%"
      - assertVisible: "9 o.clock"
      - takeScreenshot: conversational-poop-time-wheel
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: time.wheel.hour
          point: "50%,70%"
- tapOn:
    id: picker.done
- assertVisible:
    id: preview.poopTime.0
    text: '.*9:30.*10:00.*'
- assertVisible:
    id: preview.poopMealTime.0
    text: '.*Meal 1.*8:00.*'
- takeScreenshot: conversational-poop-window-edited
- tapOn:
    id: preview.back
- tapOn:
    id: preview.continue
- assertVisible:
    id: preview.poopTime.0
    text: '.*9:30.*10:00.*'
- tapOn:
    id: preview.continue
- assertVisible:
    id: preview.planTimeline
- assertNotVisible: See the full schedule
- takeScreenshot: conversational-plan-timeline
- tapOn:
    id: preview.continue
- assertNotVisible: Optional
- tapOn:
    id: notifications.timing.meal.enabled
- tapOn:
    id: notifications.timing.meal.time
- tapOn:
    id: notifications.timing.option.-15
- tapOn:
    id: notifications.timing.poop.enabled
- tapOn:
    id: notifications.timing.poop.time
- tapOn:
    id: notifications.timing.option.5
- scrollUntilVisible:
    element:
      id: notifications.timing.pottyAfterMeal.enabled
    direction: DOWN
- tapOn:
    id: notifications.timing.pottyAfterMeal.enabled
- tapOn:
    id: notifications.timing.pottyAfterMeal.time
- tapOn:
    id: notifications.timing.option.45
- scrollUntilVisible:
    element:
      id: notifications.timing.pottyAfterPee.enabled
    direction: DOWN
- tapOn:
    id: notifications.timing.pottyAfterPee.enabled
- tapOn:
    id: notifications.timing.pottyAfterPee.time
- tapOn:
    id: notifications.timing.option.180
- scrollUntilVisible:
    element:
      id: preview.prompt
    direction: UP
    visibilityPercentage: 100
- takeScreenshot: conversational-reminder-timing
- tapOn:
    id: preview.reminders.later
- takeScreenshot: conversational-ready
- tapOn:
    id: preview.continue
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- assertVisible:
    id: nav.open
- assertVisible:
    id: onboarding.spotlight
- assertNotVisible:
    id: preview.review
- takeScreenshot: conversational-spotlight
