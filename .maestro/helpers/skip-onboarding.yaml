appId: com.patrickchin.puptime
---
- extendedWaitUntil:
    visible:
      id: 'screen\.(firstLaunch|onboarding)|preview.guest'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: preview.guest
    commands:
      - runFlow: conversational/to-reminders.yaml
      - tapOn:
          id: preview.reminders.later
      - tapOn:
          id: preview.skip
      - extendedWaitUntil:
          visible:
            id: screen.today
          timeout: 90000
- runFlow:
    when:
      visible:
        id: setup.step.welcome
    commands:
      - scrollUntilVisible:
          element:
            id: setup.start
          direction: DOWN
      - tapOn:
          id: setup.start
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: setup.step.profile
          timeout: 15000
- runFlow:
    when:
      visible:
        id: setup.step.profile
    commands:
      - scrollUntilVisible:
          element:
            id: setup.profile.later
          direction: DOWN
      - tapOn:
          id: setup.profile.later
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: setup.step.(account|cloud)
          timeout: 15000
- runFlow:
    when:
      visible:
        id: setup.step.account
    commands:
      - scrollUntilVisible:
          element:
            id: setup.local
          direction: DOWN
      - tapOn:
          id: setup.local
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: screen.onboarding
          timeout: 15000
- runFlow:
    when:
      visible:
        id: setup.step.cloud
    commands:
      - scrollUntilVisible:
          element:
            id: setup.cloud.local
          direction: DOWN
      - tapOn:
          id: setup.cloud.local
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: screen.onboarding
          timeout: 15000
- runFlow:
    when:
      visible:
        id: screen.onboarding
    file: skip-walkthrough.yaml
- runFlow:
    when:
      visible:
        id: setup.step.reminders
    commands:
      - scrollUntilVisible:
          element:
            id: setup.reminders.later
          direction: DOWN
      - tapOn:
          id: setup.reminders.later
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: setup.step.ready
          timeout: 15000
- runFlow:
    when:
      visible:
        id: setup.step.ready
    commands:
      - scrollUntilVisible:
          element:
            id: setup.finish
          direction: DOWN
      - tapOn:
          id: setup.finish
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: screen.today
          timeout: 90000
