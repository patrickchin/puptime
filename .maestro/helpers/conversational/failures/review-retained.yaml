appId: com.patrickchin.puptime
name: Every answer survives a failed completion and Back
---
- tapOn:
    id: "preview.back"
- tapOn:
    id: "preview.back"
- tapOn:
    id: "preview.back"
- tapOn:
    id: "preview.skip"
- tapOn:
    id: "preview.back"
- tapOn:
    id: "preview.back"
- tapOn:
    id: "preview.back"
- tapOn:
    id: "preview.back"
- assertVisible:
    id: "preview.name"
    text: "Biscuit"
- tapOn:
    id: "preview.continue"
- tapOn:
    id: "preview.choice.middle"
- tapOn:
    id: "preview.choice.meals-2"
- assertVisible:
    id: "preview.mealTime.0"
    text: ".*8:00.*"
- tapOn:
    id: "preview.continue"
- assertVisible:
    id: "preview.poopTime.0"
    text: ".*8:30.*9:00.*"
- tapOn:
    id: "preview.continue"
- tapOn:
    id: "preview.continue"
- scrollUntilVisible:
    element:
      id: "notifications.timing.pottyAfterMeal.time"
    direction: DOWN
- assertVisible:
    id: "notifications.timing.pottyAfterMeal.time"
    text: ".*45m.*"
- assertVisible:
    id: "notifications.timing.pottyAfterMeal.enabled"
    checked: true
- tapOn:
    id: "preview.reminders.later"
- runFlow: "../skip-sharing.yaml"
- assertVisible:
    id: "preview.ready"
