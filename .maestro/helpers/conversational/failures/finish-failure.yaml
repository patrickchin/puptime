appId: com.patrickchin.puptime
name: Failed completion never leaves setup
---
- tapOn:
    id: "preview.continue"
- assertVisible: We couldn.t save your setup.*
- assertVisible:
    id: "preview.ready"
- assertNotVisible:
    id: "screen.today"
- assertNotVisible:
    id: "onboarding.spotlight"
- takeScreenshot: completion-failure-retains-draft
