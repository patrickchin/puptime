appId: com.patrickchin.puptime
name: Permission intent retry succeeds
---
- tapOn:
    id: "preview.reminders.allow"
- tapOn:
    text: "^Allow$"
- assertVisible:
    id: "preview.ready"
- waitForAnimationToEnd
- tapOn:
    id: "preview.back"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "preview.prompt"
      text: "Set up reminders"
    timeout: 30000
- waitForAnimationToEnd
