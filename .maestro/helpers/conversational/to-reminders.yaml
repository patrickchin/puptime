appId: com.patrickchin.puptime
name: Skip optional answers to reminder setup
---
# Startup account recovery temporarily disables all welcome actions.
- extendedWaitUntil:
    visible:
      id: preview.guest
      enabled: true
    timeout: 30000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: preview.welcome
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: preview.profile
                commands:
                  - tapOn:
                      id: preview.guest
                      enabled: true
                      retryTapIfNoChange: true
                  - waitForAnimationToEnd:
                      timeout: 5000
      - extendedWaitUntil:
          visible:
            id: preview.profile
          timeout: 5000
- assertVisible:
    id: preview.profile
# Hosted prepare failed at the age-heading assertion; its cause is unproved.
# Retry only this source/destination boundary, never the age-answer action.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: preview.profile
          commands:
            - waitForAnimationToEnd
            - runFlow:
                when:
                  notVisible:
                    id: preview.prompt
                    text: How old is your pup?
                commands:
                  - assertVisible:
                      id: preview.profile
                  - tapOn:
                      id: preview.skip
                      text: ^I’ll add their name later$
                      enabled: true
      - assertVisible:
          id: preview.prompt
          text: How old is your pup?
- assertVisible:
    id: preview.prompt
    text: How old is your pup?
- waitForAnimationToEnd
- tapOn:
    id: preview.skip
- assertVisible:
    id: preview.prompt
    text: Let’s plan mealtimes.
- waitForAnimationToEnd
- tapOn:
    id: preview.skip
- assertVisible:
    id: preview.poopTimes
- assertNotVisible:
    id: preview.poopMealTime.0
# A changed hierarchy did not prove arrival in the failed hosted run. Retry
# only this source/target transition, at most once plus two retries.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: preview.poopTimes
          commands:
            - waitForAnimationToEnd
            - runFlow:
                when:
                  notVisible:
                    id: preview.planTimeline
                commands:
                  - assertVisible:
                      id: preview.poopTimes
                  - tapOn:
                      id: preview.skip
                      text: ^Skip for now$
                      enabled: true
      - assertVisible:
          id: preview.planTimeline
- assertVisible:
    id: preview.planTimeline
- waitForAnimationToEnd
- tapOn:
    id: preview.continue
- assertVisible:
    id: preview.prompt
    text: Set up reminders
- waitForAnimationToEnd
