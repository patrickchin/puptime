appId: com.patrickchin.puptime
name: Skip optional answers to reminder setup
---
# Startup account recovery temporarily disables all welcome actions.
- extendedWaitUntil:
    visible:
      id: preview.guest
      enabled: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: preview.guest
    enabled: true
    retryTapIfNoChange: true
- assertVisible:
    id: preview.profile
- waitForAnimationToEnd
- tapOn:
    id: preview.skip
- assertVisible:
    id: preview.prompt
    text: How old is your pup?
- waitForAnimationToEnd
- tapOn:
    id: preview.skip
- assertVisible:
    id: preview.prompt
    text: Let’s plan mealtimes.
- waitForAnimationToEnd
- tapOn:
    id: preview.skip
- assertVisible:
    id: preview.poopTimes
- assertNotVisible:
    id: preview.poopMealTime.0
# A changed hierarchy did not prove arrival in the failed hosted run. Retry
# only this source/target transition, at most once plus two retries.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: preview.poopTimes
          commands:
            - waitForAnimationToEnd
            - runFlow:
                when:
                  notVisible:
                    id: preview.planTimeline
                commands:
                  - assertVisible:
                      id: preview.poopTimes
                  - tapOn:
                      id: preview.skip
                      text: ^Skip for now$
                      enabled: true
      - assertVisible:
          id: preview.planTimeline
- assertVisible:
    id: preview.planTimeline
- waitForAnimationToEnd
- tapOn:
    id: preview.continue
- assertVisible:
    id: preview.prompt
    text: Set up reminders
- waitForAnimationToEnd
