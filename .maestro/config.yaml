flows:
  - ios/*.yaml
  - guide-audio.yaml
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - iOS first-open completes and replays the guide
    - iOS first-open notification opt in
    - iOS navigation and empty states
    - iOS log CRUD, undo, and persistence
    - iOS simple log and date sections
    - iOS routine create, edit, reminder permission, and remove
    - iOS settings and preference persistence
    - iOS side navigation and notification preferences
    - iOS custom timed reminder create remove and restart
    - iOS populated insights and timeline controls
    - iOS CSV picker cancellation preserves activity
    - Puppy guide audio controls
