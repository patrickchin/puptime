appId: com.patrickchin.puptime
name: Local editor state leaves unchanged activity rows alone
---
- launchApp:
    stopApp: false
    permissions: {}
- tapOn:
    id: event.meal.edit
    index: 0
- scrollUntilVisible:
    element:
      id: editor.note.input
    direction: DOWN
- tapOn:
    id: editor.note.input
- assertVisible:
    id: Return
- scrollUntilVisible:
    element:
      id: editor.close
    direction: UP
- tapOn:
    id: editor.close
- extendedWaitUntil:
    notVisible:
      id: editor.note.input
    timeout: 30000
- assertVisible:
    id: screen.today
- takeScreenshot: sharing-render-verified
