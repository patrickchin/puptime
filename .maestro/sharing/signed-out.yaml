appId: com.patrickchin.puptime
name: An invitation requires a normal account
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: confirm-link.yaml
- extendedWaitUntil:
    visible:
      id: screen.sharedPuppies
    timeout: 30000
- assertVisible:
    id: account.email.input
- assertNotVisible:
    id: shared.accept
- takeScreenshot: sharing-invitation-sign-in
- tapOn:
    id: shared.back
- assertVisible:
    id: 'screen\.(today|account)'
