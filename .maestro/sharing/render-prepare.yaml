appId: com.patrickchin.puptime
name: Prepare populated rows for render measurement
---
- launchApp:
    stopApp: false
    permissions: {}
- scrollUntilVisible:
    element:
      id: quick.pee
    direction: UP
    visibilityPercentage: 50
    timeout: 45000
- scrollUntilVisible:
    element:
      id: event.meal.edit
    direction: DOWN
- assertVisible:
    id: event.meal.edit
