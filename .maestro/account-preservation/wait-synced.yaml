appId: com.patrickchin.puptime
name: Account preservation waits for automatic sync
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: ../helpers/open-account.yaml
- scrollUntilVisible:
    element:
      id: account.status
    direction: UP
- extendedWaitUntil:
    visible:
      id: account.status
      text: ${ACCOUNT_STATUS || "Up to date"}
    timeout: 45000
