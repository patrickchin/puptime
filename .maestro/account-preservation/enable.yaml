appId: com.patrickchin.puptime
name: Account preservation enable
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: ../helpers/open-account.yaml
- scrollUntilVisible:
    element:
      id: account.enable
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: account.enable
      enabled: true
    timeout: 30000
- tapOn:
    id: account.enable
    enabled: true
- extendedWaitUntil:
    visible:
      text: ${ACCOUNT_READY || "^(Up to date|Combine these histories\\?)$"}
    timeout: 45000
- runFlow:
    when:
      visible:
        id: account.combine.dialog
    commands:
      - tapOn:
          id: account.combine.confirm
- scrollUntilVisible:
    element:
      id: account.status
    direction: UP
- extendedWaitUntil:
    visible:
      id: account.status
      text: ${ACCOUNT_STATUS || "Up to date"}
    timeout: 45000
- scrollUntilVisible:
    element:
      id: account.local.count
    direction: UP
- assertVisible:
    id: account.local.count
    text: ${ACCOUNT_LOG_COUNT || (EXPECTED_COUNT + " activity logs")}
