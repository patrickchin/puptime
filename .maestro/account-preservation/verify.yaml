appId: com.patrickchin.puptime
name: Account preservation verify
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: ../helpers/open-account.yaml
- scrollUntilVisible:
    element:
      id: account.code.input
    direction: DOWN
- waitForAnimationToEnd
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: account.code.input
          enabled: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
      - eraseText: 6
      - inputText: ${MAESTRO_TEST_CODE}
      - assertVisible:
          id: account.code.input
          text: ${MAESTRO_TEST_CODE}
- tapOn: Sign-in code
- scrollUntilVisible:
    element:
      id: account.verify
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: account.verify
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: account.code.input
    timeout: 30000
- scrollUntilVisible:
    element:
      id: account.enable
    direction: DOWN
- assertNotVisible:
    id: account.email.input
- scrollUntilVisible:
    element:
      id: account.back
    direction: UP
- assertVisible: My account
- assertVisible: Signed in as
- assertVisible:
    id: account.email
    text: ${TEST_EMAIL}
- takeScreenshot: my-account-signed-in
- waitForAnimationToEnd
- tapOn:
    id: account.back
    retryTapIfNoChange: true
- assertVisible:
    id: screen.today
- takeScreenshot: my-account-returned-log
- runFlow: ../helpers/open-account.yaml
- assertVisible:
    id: account.email
    text: ${TEST_EMAIL}
- scrollUntilVisible:
    element:
      id: account.enable
    direction: DOWN
