appId: com.patrickchin.puptime
name: Account preservation request
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: ../helpers/open-account.yaml
- tapOn:
    id: account.refresh
    optional: true
- extendedWaitUntil:
    visible:
      id: account.email.input
    timeout: 30000
- scrollUntilVisible:
    element:
      id: account.email.input
    direction: DOWN
- waitForAnimationToEnd
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: account.email.input
          enabled: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
      - eraseText: 80
      - inputText: ${TEST_EMAIL}
      - assertVisible:
          id: account.email.input
          text: \A\Q${TEST_EMAIL}\E\z
- scrollUntilVisible:
    element:
      id: account.sendCode
      enabled: true
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: account.sendCode
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: account.code.input
    timeout: 30000
