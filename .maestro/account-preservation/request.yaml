appId: com.patrickchin.puptime
name: Account preservation request
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: ../helpers/open-account.yaml
- tapOn:
    id: account.refresh
    optional: true
- extendedWaitUntil:
    visible:
      id: account.email.input
    timeout: 30000
- scrollUntilVisible:
    element:
      id: account.email.input
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: account.email.input
    retryTapIfNoChange: true
- eraseText: 80
- inputText: ${TEST_EMAIL}
- scrollUntilVisible:
    element:
      id: account.sendCode
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: account.sendCode
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: account.code.input
    timeout: 30000
