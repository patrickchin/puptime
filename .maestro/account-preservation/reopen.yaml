appId: com.patrickchin.puptime
name: Account preservation reopen
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: ../helpers/open-account.yaml
- scrollUntilVisible:
    element:
      id: account.back
    direction: UP
- waitForAnimationToEnd
- tapOn:
    id: account.back
    retryTapIfNoChange: true
- runFlow: ../helpers/conversational/assert-normal.yaml
- runFlow: ../helpers/open-account.yaml
- extendedWaitUntil:
    visible:
      id: account.status
      text: ${ACCOUNT_STATUS || "Up to date"}
    timeout: 45000
- assertVisible:
    id: account.local.count
    text: ${ACCOUNT_LOG_COUNT || (EXPECTED_COUNT + " activity logs")}
- takeScreenshot: recovered-account-history
