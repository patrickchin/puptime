appId: com.patrickchin.puptime
name: Account preservation sign-out
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: ../helpers/open-account.yaml
- scrollUntilVisible:
    element:
      id: account.status
    direction: UP
- extendedWaitUntil:
    visible:
      id: account.status
      text: ${ACCOUNT_STATUS || "Up to date"}
    timeout: 45000
- scrollUntilVisible:
    element:
      id: account.signOut
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: account.signOut
    retryTapIfNoChange: true
- assertVisible: ${ACCOUNT_SIGN_OUT_TITLE || "^Sign out on this device\\?$"}
- waitForAnimationToEnd
- tapOn:
    retryTapIfNoChange: true
    text: ${ACCOUNT_SIGN_OUT_ACTION || "(?i)^Sign out$"}
    childOf:
      containsChild:
        text: ${ACCOUNT_CANCEL || "(?i)^Cancel$"}
- extendedWaitUntil:
    notVisible:
      id: account.identity
    timeout: 30000
- scrollUntilVisible:
    element:
      id: account.email.input
    direction: UP
- assertVisible:
    id: account.email.input
