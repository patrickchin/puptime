appId: com.patrickchin.puptime
name: Account preservation sign-out
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: ../helpers/open-account.yaml
- scrollUntilVisible:
    element:
      id: account.status
    direction: UP
- extendedWaitUntil:
    visible:
      id: account.status
      text: Up to date
    timeout: 45000
- scrollUntilVisible:
    element:
      id: account.signOut
    direction: DOWN
- tapOn:
    id: account.signOut
- assertVisible: ^Sign out on this device\?$
- tapOn:
    text: (?i)^Sign out$
    rightOf:
      text: (?i)^Cancel$
- extendedWaitUntil:
    visible:
      id: account.email.input
    timeout: 30000
