appId: com.patrickchin.puptime
name: Account preservation sign-out
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow: ../helpers/open-account.yaml
- scrollUntilVisible:
    element:
      id: account.status
    direction: UP
- extendedWaitUntil:
    visible:
      id: account.status
      text: Up to date
    timeout: 45000
- scrollUntilVisible:
    element:
      id: account.signOut
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: account.signOut
    retryTapIfNoChange: true
- assertVisible: ^Sign out on this device\?$
- waitForAnimationToEnd
- tapOn:
    retryTapIfNoChange: true
    text: (?i)^Sign out$
    above:
      id: account.signOut
    rightOf:
      text: (?i)^Cancel$
- extendedWaitUntil:
    notVisible:
      id: account.identity
    timeout: 30000
- scrollUntilVisible:
    element:
      id: account.email.input
    direction: UP
- assertVisible:
    id: account.email.input
