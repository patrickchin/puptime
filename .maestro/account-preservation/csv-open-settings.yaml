appId: com.patrickchin.puptime
---
- launchApp:
    stopApp: false
    permissions: {}
- runFlow:
    when:
      visible:
        id: screen.account
    commands:
      - scrollUntilVisible:
          element:
            id: account.back
          direction: UP
      - tapOn:
          id: account.back
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: nav.open
    timeout: 30000
- tapOn:
    id: nav.open
- tapOn:
    id: nav.settings
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: settings.import
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: settings.import
    enabled: true
