appId: com.patrickchin.puptime
name: Welcome sign-in requests a real email code
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible:
      id: account.email.open
    timeout: 90000
- assertNotVisible: Sign-in design preview
- tapOn:
    id: account.email.open
- assertVisible:
    id: preview.account
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: account.email.input
          enabled: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
      - eraseText: 80
      - inputText: ${TEST_EMAIL}
      - assertVisible:
          id: account.email.input
          text: \A\Q${TEST_EMAIL}\E\z
- scrollUntilVisible:
    element:
      id: account.sendCode
    direction: DOWN
- tapOn:
    id: account.sendCode
- extendedWaitUntil:
    visible:
      id: account.code.input
    timeout: 30000
