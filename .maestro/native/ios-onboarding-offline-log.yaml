appId: com.patrickchin.puptime
name: Save a real offline log before replaying onboarding
---
- launchApp
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: quick.pee
- assertVisible:
    id: toast
- tapOn:
    id: settings.open
- assertVisible:
    id: settings.puppy.name
    text: .*Mochi.*
