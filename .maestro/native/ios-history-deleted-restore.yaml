appId: com.patrickchin.puptime
name: Find a deleted log in Recent changes and restore its original identity
---
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.drawer
- waitForAnimationToEnd
- tapOn:
    id: nav.settings
- extendedWaitUntil:
    notVisible:
      id: nav.drawer
    timeout: 15000
- scrollUntilVisible:
    element:
      id: settings.history.open
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- waitForAnimationToEnd
- tapOn:
    id: settings.history.open
- assertVisible:
    id: screen.eventHistory
- scrollUntilVisible:
    element:
      id: history.recent.${DELETION_SEQUENCE}
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- waitForAnimationToEnd
- tapOn:
    id: history.recent.${DELETION_SEQUENCE}
- assertVisible:
    id: history.panel
- assertVisible:
    id: history.deleted
- scrollUntilVisible:
    element:
      id: history.local.${DELETED_ORIGINAL_SEQUENCE}
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- waitForAnimationToEnd
- tapOn:
    id: history.local.${DELETED_ORIGINAL_SEQUENCE}
- assertVisible:
    id: history.after.note
    text: Deleted note
- scrollUntilVisible:
    element:
      id: history.restore
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- waitForAnimationToEnd
- tapOn:
    id: history.restore
- assertVisible:
    id: history.confirm
- tapOn:
    id: history.confirm.restore
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: history.restored
    timeout: 15000
- takeScreenshot: recent-changes-restores-deleted-log
