appId: com.patrickchin.puptime
name: Local onboarding practice and reminder choice
---
- scrollUntilVisible:
    element:
      id: setup.local
    direction: DOWN
- tapOn:
    id: setup.local
- assertVisible:
    id: onboarding.step.0
- scrollUntilVisible:
    element:
      id: onboarding.demo.pee
    direction: DOWN
- tapOn:
    id: onboarding.demo.pee
- assertVisible:
    id: onboarding.demo.pee
    selected: true
- runFlow:
    file: ../helpers/walkthrough-next.yaml
    env:
      FROM_STEP: '0'
      TO_ID: 'onboarding\.step\.1'
- assertVisible:
    id: onboarding.step.1
- runFlow:
    file: ../helpers/walkthrough-next.yaml
    env:
      FROM_STEP: '1'
      TO_ID: 'onboarding\.step\.2'
- assertVisible:
    id: onboarding.step.2
- scrollUntilVisible:
    element:
      id: onboarding.demo.routine.reminder
    direction: DOWN
- tapOn:
    id: onboarding.demo.routine.reminder
- runFlow:
    file: ../helpers/walkthrough-next.yaml
    env:
      FROM_STEP: '2'
      TO_ID: 'setup\.step\.reminders'
- assertVisible:
    id: setup.step.reminders
- takeScreenshot: first-open-reminders
- scrollUntilVisible:
    element:
      id: setup.reminders.later
    direction: DOWN
- tapOn:
    id: setup.reminders.later
- assertVisible:
    id: setup.step.ready
- takeScreenshot: first-open-ready
