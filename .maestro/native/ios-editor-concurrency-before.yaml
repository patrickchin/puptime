appId: com.patrickchin.puptime
name: iOS editor keeps an open draft for remote update check
---
- launchApp:
    clearState: true
- runFlow: ../helpers/skip-onboarding.yaml
- tapOn:
    id: quick.pee
- scrollUntilVisible:
    element:
      id: event.pee.edit
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: event.pee.edit
- assertVisible:
    id: editor
- scrollUntilVisible:
    element:
      id: editor.note.input
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: editor.note.input
- eraseText
- setClipboard: local first
- pasteText
- assertVisible:
    id: editor.note.input
    text: local first
