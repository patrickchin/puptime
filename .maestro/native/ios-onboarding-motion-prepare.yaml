appId: com.patrickchin.puptime
name: Set the real iOS Reduce Motion preference before practice
---
- launchApp:
    appId: com.apple.Preferences
    stopApp: false
- assertVisible:
    id: REDUCE_MOTION
- runFlow:
    when:
      visible:
        id: REDUCE_MOTION
        text: ^${OTHER_MOTION_VALUE}$
    commands:
      - tapOn:
          point: ${MOTION_SWITCH_POINT}
- assertVisible:
    id: REDUCE_MOTION
    text: ^${MOTION_VALUE}$
- takeScreenshot: actual-ios-motion-setting
- launchApp:
    appId: com.patrickchin.puptime
    clearState: true
- extendedWaitUntil:
    visible:
      id: screen.firstLaunch
    timeout: 90000
- scrollUntilVisible:
    element:
      id: setup.start
    direction: DOWN
    centerElement: true
- tapOn:
    id: setup.start
- scrollUntilVisible:
    element:
      id: setup.profile.later
    direction: DOWN
    centerElement: true
- tapOn:
    id: setup.profile.later
- scrollUntilVisible:
    element:
      id: setup.local
    direction: DOWN
    centerElement: true
- tapOn:
    id: setup.local
- extendedWaitUntil:
    visible:
      id: onboarding.step.0
    timeout: 90000
