appId: com.patrickchin.puptime
name: iOS rejected enrollment returns to current puppy confirmation
---
- launchApp
- runFlow: ../helpers/open-account.yaml
- extendedWaitUntil:
    visible:
      id: account.connection.phone.count
      text: 1 activity log
    timeout: 30000
- assertVisible:
    id: account.connection.phone.count
    text: 1 activity log
- scrollUntilVisible:
    element:
      id: account.connection.cloud.name
    direction: DOWN
    visibilityPercentage: 100
- assertVisible: In your cloud account
- scrollUntilVisible:
    element:
      id: account.enable
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: account.enable
    text: Combine these histories…
    enabled: true
