appId: com.patrickchin.puptime
name: Device notification delivery setting
---
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: nav.open
- tapOn:
    id: nav.notifications
- assertVisible:
    id: screen.notifications
- scrollUntilVisible:
    element:
      id: settings.notifications.deviceDelivery
    direction: DOWN
    centerElement: true
- assertVisible:
    id: settings.notifications.deviceDelivery
- takeScreenshot: device-delivery-off
