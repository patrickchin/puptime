appId: com.patrickchin.puptime
name: iOS tour replay returns to Settings
---
- launchApp:
    clearState: true
- runFlow: ../helpers/skip-onboarding.yaml
- tapOn:
    id: settings.open
- scrollUntilVisible:
    element:
      id: settings.guide.open
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: settings.guide.open
- assertVisible:
    id: onboarding.step.0
- tapOn:
    id: onboarding.skip
- assertVisible:
    id: screen.settings
