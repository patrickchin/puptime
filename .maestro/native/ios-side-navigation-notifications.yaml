appId: com.patrickchin.puptime
name: iOS side navigation and notification preferences
---
# Fresh synthetic installation only; the populated qualification never runs this flow.
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- runFlow: ../helpers/skip-onboarding.yaml
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- assertNotVisible:
    id: nav.notifications
- assertNotVisible:
    id: nav.close
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.log
    selected: true
- scrollUntilVisible:
    element:
      id: nav.notifications
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- assertVisible:
    id: nav.notifications
- scrollUntilVisible:
    element:
      id: nav.close
    direction: UP
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: nav.close
- assertNotVisible:
    id: nav.notifications
- assertVisible:
    id: screen.today
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.close
- tapOn:
    point: 95%,50%
- assertNotVisible:
    id: nav.close
- assertVisible:
    id: screen.today
- tapOn:
    id: nav.open
- scrollUntilVisible:
    element:
      id: nav.notifications
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: nav.notifications
- assertVisible:
    id: screen.notifications
- assertNotVisible:
    id: nav.close
- assertVisible:
    id: settings.notifications.deviceDelivery
    checked: false
- tapOn:
    id: settings.notifications.deviceDelivery
# The driver may already accept a configured system prompt; verify permission below.
- tapOn:
    text: ^Allow$
    optional: true
- assertVisible:
    id: settings.notifications.deviceDelivery
    checked: true
- assertNotVisible:
    id: settings.notifications.permission
- scrollUntilVisible:
    element:
      id: notifications.timing.pottyAfterPee.enabled
    direction: DOWN
- assertVisible:
    id: notifications.timing.pottyAfterPee.enabled
    checked: false
- tapOn:
    id: notifications.timing.pottyAfterPee.enabled
- assertVisible:
    id: notifications.timing.pottyAfterPee.enabled
    checked: true
- tapOn:
    id: notifications.timing.pottyAfterPee.time
- assertVisible:
    id: notifications.timing.option.120
    # Driver versions expose the selected radio via its value or painted check.
    text: 'radio button, checked|.*✓.*'
- tapOn:
    id: notifications.timing.option.60
- assertVisible:
    id: notifications.timing.pottyAfterPee.time
    text: .*1h.*
- assertNotVisible:
    id: notifications.timing.option.60
- scrollUntilVisible:
    element:
      id: settings.notifications.lead.15
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: settings.notifications.lead.15
      enabled: true
    timeout: 10000
- assertVisible:
    id: settings.notifications.lead.10
    text: radio button, checked
- tapOn:
    id: settings.notifications.lead.15
    retryTapIfNoChange: true
- assertVisible:
    id: settings.notifications.lead.15
    text: radio button, checked
- scrollUntilVisible:
    element:
      id: settings.notifications.routines
    direction: UP
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: settings.notifications.routines
- assertVisible:
    id: screen.schedule
- tapOn:
    id: nav.open
- scrollUntilVisible:
    element:
      id: nav.schedule
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- assertVisible:
    id: nav.schedule
    selected: true
- scrollUntilVisible:
    element:
      id: nav.notifications
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: nav.notifications
- assertVisible:
    id: screen.notifications
- tapOn:
    id: nav.open
- scrollUntilVisible:
    element:
      id: nav.notifications
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- assertVisible:
    id: nav.notifications
    selected: true
- scrollUntilVisible:
    element:
      id: nav.close
    direction: UP
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: nav.close
- stopApp
- launchApp:
    permissions: {}
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: nav.open
- scrollUntilVisible:
    element:
      id: nav.notifications
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: nav.notifications
- assertVisible:
    id: settings.notifications.deviceDelivery
    checked: true
- scrollUntilVisible:
    element:
      id: notifications.timing.pottyAfterPee.time
    direction: DOWN
- tapOn:
    id: notifications.timing.pottyAfterPee.time
- assertVisible:
    id: notifications.timing.option.60
    text: 'radio button, checked|.*✓.*'
- tapOn:
    id: notifications.timing.close
- scrollUntilVisible:
    element:
      id: settings.notifications.lead.15
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- assertVisible:
    id: settings.notifications.lead.15
    text: radio button, checked
- takeScreenshot: notifications-restored-after-restart
- tapOn:
    id: nav.open
- scrollUntilVisible:
    element:
      id: nav.settings
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: nav.settings
- tapOn:
    id: settings.language.open
- tapOn:
    id: appearance.language.es
- assertVisible:
    id: screen.settings
- tapOn:
    id: settings.back
- tapOn:
    id: nav.open
- scrollUntilVisible:
    element:
      id: nav.notifications
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- assertVisible:
    id: nav.notifications
    text: Notificaciones
- tapOn:
    id: nav.notifications
- assertVisible:
    id: screen.notifications
- scrollUntilVisible:
    element:
      id: notifications.timing.pottyAfterPee.enabled
    direction: DOWN
- assertVisible:
    id: notifications.timing.pottyAfterPee.enabled
    checked: true
- scrollUntilVisible:
    element:
      id: settings.notifications.lead.15
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- assertVisible:
    id: settings.notifications.lead.15
    text: radio button, checked
- takeScreenshot: notifications-spanish-preferences
- tapOn:
    id: nav.open
- scrollUntilVisible:
    element:
      id: nav.settings
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: nav.settings
- tapOn:
    id: settings.language.open
- tapOn:
    id: appearance.language.en
- tapOn:
    id: settings.back
- tapOn:
    id: nav.open
- scrollUntilVisible:
    element:
      id: nav.notifications
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: nav.notifications
- assertVisible:
    id: screen.notifications
