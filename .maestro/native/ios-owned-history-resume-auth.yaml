appId: com.patrickchin.puptime
name: Private interrupted activation resumes its existing owner
---
- runFlow:
    when:
      visible:
        id: screen.today
    commands:
      - tapOn:
          id: nav.open
      - waitForAnimationToEnd
      - tapOn:
          id: nav.settings
- runFlow:
    when:
      visible:
        id: screen.settings
    commands:
      - scrollUntilVisible:
          element:
            id: settings.account.open
          direction: DOWN
          timeout: 120000
          speed: 80
          visibilityPercentage: 100
          centerElement: false
      - waitForAnimationToEnd
      - tapOn:
          id: settings.account.open
- extendedWaitUntil:
    visible:
      id: account.status
      text: ^Up to date$
    timeout: 180000
