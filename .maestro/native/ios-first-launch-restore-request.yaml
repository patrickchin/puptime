appId: com.patrickchin.puptime
name: Returning person signs in on a fresh local setup
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: setup.step.welcome
    timeout: 90000
- tapOn:
    id: setup.signIn
- extendedWaitUntil:
    visible:
      id: account.email.input
    timeout: 30000
- tapOn:
    id: account.email.input
- setClipboard: ${TEST_EMAIL}
- pasteText
- tapOn:
    id: setup.step.account
- scrollUntilVisible:
    element:
      id: account.sendCode
    direction: DOWN
- tapOn:
    id: account.sendCode
- extendedWaitUntil:
    visible:
      id: account.code.input
    timeout: 30000
