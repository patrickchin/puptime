appId: com.patrickchin.puptime
name: Restore the dedicated simulator’s original Reduce Motion preference
---
- launchApp:
    appId: com.apple.Preferences
    stopApp: false
- runFlow:
    when:
      visible:
        id: REDUCE_MOTION
        text: ^1$
    commands:
      - tapOn:
          point: ${MOTION_SWITCH_POINT}
- assertVisible:
    id: REDUCE_MOTION
    text: ^0$
- launchApp:
    appId: com.patrickchin.puptime
    stopApp: false
