appId: com.patrickchin.puptime
name: Private genuine deployed email request on the fresh dedicated profile
---
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: setup.step.welcome
    timeout: 90000
- scrollUntilVisible:
    element:
      id: setup.start
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- extendedWaitUntil:
    visible:
      id: setup.start
      enabled: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: setup.start
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: setup.step.profile
    timeout: 15000
- tapOn:
    id: setup.profile.input
- inputText: Mochi
- tapOn: Done
- scrollUntilVisible:
    element:
      id: setup.profile.next
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- waitForAnimationToEnd
- tapOn:
    id: setup.profile.next
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: account.email.input
    timeout: 30000
- tapOn:
    id: account.email.input
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    id: setup.step.account
- scrollUntilVisible:
    element:
      id: account.sendCode
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: account.sendCode
- extendedWaitUntil:
    visible:
      id: account.code.input
    timeout: 30000
