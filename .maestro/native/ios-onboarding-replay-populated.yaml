appId: com.patrickchin.puptime
name: Replay practice and both exits preserve populated puppy data
---
- scrollUntilVisible:
    element:
      id: settings.notifications.permission
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- copyTextFrom:
    id: settings.notifications.permission
- evalScript: ${output.permissionBefore = maestro.copiedText}
- scrollUntilVisible:
    element:
      id: settings.guide.open
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: settings.guide.open
- tapOn:
    id: onboarding.demo.pee
- tapOn:
    id: onboarding.demo.poop
- tapOn:
    id: onboarding.demo.meal
- tapOn:
    id: onboarding.primary
- assertVisible:
    id: onboarding.demo.timeline.today
- tapOn:
    id: onboarding.primary
- tapOn:
    id: onboarding.demo.routine.reminder
- tapOn:
    id: onboarding.primary
- assertNotVisible:
    id: onboarding.name.input
- assertNotVisible:
    id: onboarding.notifications.allow
- tapOn:
    id: onboarding.primary
- assertVisible:
    id: screen.settings
- tapOn:
    id: settings.guide.open
- tapOn:
    id: onboarding.skip
- assertVisible:
    id: screen.settings
- takeScreenshot: populated-replay-returns-settings
- scrollUntilVisible:
    element:
      id: settings.notifications.permission
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: settings.notifications.permission
    text: ${output.permissionBefore}
- takeScreenshot: replay-preserves-os-permission
