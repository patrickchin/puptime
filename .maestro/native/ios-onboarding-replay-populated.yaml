appId: com.patrickchin.puptime
name: Replay practice and both exits preserve populated puppy data
---
- scrollUntilVisible:
    element:
      id: settings.back
    direction: UP
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: settings.back
- tapOn:
    id: nav.open
- tapOn:
    id: nav.notifications
- assertVisible:
    id: screen.notifications
- evalScript: ${output.permissionBefore = ''}
- runFlow:
    when:
      visible:
        id: settings.notifications.permission
    commands:
      - copyTextFrom:
          id: settings.notifications.permission
      - evalScript: ${output.permissionBefore = maestro.copiedText}
- tapOn:
    id: nav.open
- tapOn:
    id: nav.settings
- assertVisible:
    id: screen.settings
- scrollUntilVisible:
    element:
      id: settings.guide.open
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: settings.guide.open
- tapOn:
    id: onboarding.demo.pee
- tapOn:
    id: onboarding.demo.poop
- tapOn:
    id: onboarding.demo.meal
- tapOn:
    id: onboarding.primary
- assertVisible:
    id: onboarding.demo.timeline.today
- tapOn:
    id: onboarding.primary
- tapOn:
    id: onboarding.demo.routine.reminder
- tapOn:
    id: onboarding.primary
- assertNotVisible:
    id: onboarding.name.input
- assertNotVisible:
    id: onboarding.notifications.allow
- tapOn:
    id: onboarding.primary
- assertVisible:
    id: screen.settings
- tapOn:
    id: settings.guide.open
- tapOn:
    id: onboarding.skip
- assertVisible:
    id: screen.settings
- takeScreenshot: populated-replay-returns-settings
- scrollUntilVisible:
    element:
      id: settings.back
    direction: UP
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: settings.back
- tapOn:
    id: nav.open
- tapOn:
    id: nav.notifications
- assertVisible:
    id: screen.notifications
- runFlow:
    when:
      true: ${output.permissionBefore !== ''}
    commands:
      - assertVisible:
          id: settings.notifications.permission
          text: ${output.permissionBefore}
- runFlow:
    when:
      true: ${output.permissionBefore === ''}
    commands:
      - assertNotVisible:
          id: settings.notifications.permission
- takeScreenshot: replay-preserves-os-permission
- tapOn:
    id: nav.open
- tapOn:
    id: nav.settings
- assertVisible:
    id: screen.settings
