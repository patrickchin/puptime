appId: com.patrickchin.puptime
name: iOS puppy rename saves explicitly and survives restart
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible:
        id: screen.onboarding
    file: ../helpers/skip-onboarding.yaml
- runFlow:
    when:
      visible:
        id: screen.settings
    commands:
      - tapOn:
          id: settings.back
- tapOn:
    id: settings.open
- assertVisible:
    id: settings.puppy.name
- tapOn:
    id: settings.puppy.name
- assertVisible: Puppy’s name
- eraseText: 20
- inputText: Mochi
- tapOn: Save
- assertVisible:
    id: settings.puppy.name
    text: .*Mochi.*
- takeScreenshot: puppy-name-saved
- launchApp
- tapOn:
    id: settings.open
- assertVisible:
    id: settings.puppy.name
    text: .*Mochi.*
- tapOn:
    id: settings.puppy.name
- eraseText: 20
- inputText: Cancelled draft
- tapOn: Cancel
- assertVisible:
    id: settings.puppy.name
    text: .*Mochi.*
