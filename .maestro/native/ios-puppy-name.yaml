appId: com.patrickchin.puptime
name: iOS puppy rename saves explicitly and survives restart
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible:
        id: 'screen\.(firstLaunch|onboarding)'
    file: ../helpers/skip-onboarding.yaml
- runFlow:
    when:
      visible:
        id: screen.settings
    commands:
      - tapOn:
          id: settings.back
- tapOn:
    id: nav.open
- tapOn:
    id: nav.pets
- tapOn:
    id: nav.puppy
- assertVisible:
    id: settings.puppy.name
- tapOn:
    id: settings.puppy.name
- assertVisible: {id: settings.puppy.name.input}
- eraseText: 20
- inputText: Mochi
- tapOn: Save
- assertVisible:
    id: settings.puppy.name
    text: .*Mochi.*
- takeScreenshot: puppy-name-saved
- launchApp
- tapOn:
    id: nav.open
- tapOn:
    id: nav.pets
- tapOn:
    id: nav.puppy
- assertVisible:
    id: settings.puppy.name
    text: .*Mochi.*
- tapOn:
    id: settings.puppy.name
- eraseText: 20
- inputText: Cancelled draft
- tapOn: Cancel
- assertVisible:
    id: settings.puppy.name
    text: .*Mochi.*
