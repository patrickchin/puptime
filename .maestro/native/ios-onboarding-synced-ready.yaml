appId: com.patrickchin.puptime
name: Normal installed client acknowledges populated cloud history
---
- launchApp
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: nav.open
- tapOn:
    id: nav.pets
- assertVisible:
    id: settings.puppy.name
    text: .*Mochi.*
- tapOn:
    id: nav.open
- tapOn:
    id: nav.account
- extendedWaitUntil:
    visible:
      id: account.status
      text: Up to date
    timeout: 90000
- tapOn:
    id: account.back
- assertVisible:
    id: screen.pets
- takeScreenshot: puppy-name-current-settings
