appId: com.patrickchin.puptime
name: Denied notification permission never blocks first logging
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- extendedWaitUntil:
    visible:
      id: onboarding.step.0
    timeout: 90000
- tapOn:
    id: onboarding.primary
- tapOn:
    id: onboarding.primary
- tapOn:
    id: onboarding.demo.routine.reminder
- tapOn:
    id: onboarding.primary
- assertVisible:
    id: onboarding.step.3
- tapOn:
    id: onboarding.notifications.allow
- tapOn: Don.t Allow
- assertVisible:
    id: onboarding.notifications.allow
    text: Open Settings
- tapOn:
    id: onboarding.primary
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: settings.open
- scrollUntilVisible:
    element:
      id: settings.notifications.permission
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: settings.notifications.permission
    text: .*Off in device settings.*
- takeScreenshot: onboarding-notifications-denied-free-log
