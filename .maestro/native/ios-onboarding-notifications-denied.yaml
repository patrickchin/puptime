appId: com.patrickchin.puptime
name: Denied notification permission never blocks first logging
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- runFlow: ../helpers/first-launch-to-reminders.yaml
- scrollUntilVisible:
    element:
      id: setup.reminders.allow
    direction: DOWN
- tapOn:
    id: setup.reminders.allow
- tapOn: Don.t Allow
- assertVisible:
    id: setup.reminders.allow
    text: Open Settings
- scrollUntilVisible:
    element:
      id: setup.reminders.later
    direction: DOWN
- tapOn:
    id: setup.reminders.later
- assertVisible:
    id: setup.step.ready
- scrollUntilVisible:
    element:
      id: setup.finish
    direction: DOWN
- tapOn:
    id: setup.finish
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: settings.open
- scrollUntilVisible:
    element:
      id: settings.notifications.permission
    direction: DOWN
- assertVisible:
    id: settings.notifications.permission
    text: .*Off in device settings.*
- takeScreenshot: onboarding-notifications-denied-free-log
