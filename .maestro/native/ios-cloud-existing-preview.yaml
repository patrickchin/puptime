appId: com.patrickchin.puptime
name: iOS existing cloud puppy requires confirmation before combining history
---
- launchApp:
    clearState: true
    clearKeychain: false
- runFlow: ../helpers/skip-onboarding.yaml
- extendedWaitUntil:
    visible:
      id: quick.pee
    timeout: 90000
- tapOn:
    id: quick.pee
- tapOn:
    id: nav.open
- tapOn:
    id: nav.settings
- tapOn:
    id: settings.account.open
- extendedWaitUntil:
    visible:
      id: account.connection.phone.name
    timeout: 30000
- assertVisible: On this phone
- scrollUntilVisible:
    element:
      id: account.connection.cloud.name
    direction: DOWN
    visibilityPercentage: 100
- assertVisible: In your cloud account
- scrollUntilVisible:
    element:
      id: account.enable
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: account.enable
    text: Combine these histories…
    enabled: true
- tapOn:
    id: account.enable
- assertVisible: ^Combine these histories\?$
- tapOn: ^Cancel$
- assertNotVisible: ^Combine these histories\?$
- scrollUntilVisible:
    element:
      id: account.back
    direction: UP
    visibilityPercentage: 100
- tapOn:
    id: account.back
- assertVisible:
    id: screen.settings
- tapOn:
    id: settings.account.open
- scrollUntilVisible:
    element:
      id: account.enable
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: account.enable
    text: Combine these histories…
    enabled: true
