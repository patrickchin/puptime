appId: com.patrickchin.puptime
name: First-open explicit trial reaches cloud sync and the first log
---
- tapOn:
    id: setup.cloud.enable
- extendedWaitUntil:
    visible:
      id: setup.cloud.active
    timeout: 60000
- tapOn:
    id: setup.cloud.next
- tapOn:
    id: onboarding.skip
- scrollUntilVisible:
    element:
      id: setup.reminders.later
    direction: DOWN
- tapOn:
    id: setup.reminders.later
- scrollUntilVisible:
    element:
      id: setup.finish
    direction: DOWN
- tapOn:
    id: setup.finish
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 30000
- tapOn:
    id: quick.pee
- assertVisible:
    id: event.pee.edit
