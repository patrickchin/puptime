appId: com.patrickchin.puptime
name: iOS explicit named-history confirmation combines local and cloud history
---
- launchApp:
    stopApp: false
- scrollUntilVisible:
    element:
      id: account.enable
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: account.enable
- assertVisible:
    id: account.combine.dialog
- tapOn:
    id: account.combine.confirm
- extendedWaitUntil:
    visible:
      id: account.status
      text: Up to date
    timeout: 30000
- assertVisible:
    id: account.local.count
    text: ${MAESTRO_EXPECTED_COUNT} activity logs
