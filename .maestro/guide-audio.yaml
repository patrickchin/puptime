appId: com.patrickchin.puptime
name: Puppy written guides without restricted narration
tags:
  - android
  - ios
---
- launchApp:
    permissions: {}
- runFlow:
    when:
      visible:
        id: 'screen\.(firstLaunch|onboarding)|preview.guest'
    file: helpers/skip-onboarding.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: nav.open
- tapOn:
    id: nav.learn
- runFlow:
    when:
      visible:
        id: learn.back
    commands:
      - tapOn:
          id: learn.back
- tapOn:
    id: learn.article.getting-started
- assertVisible: Your first days
- assertVisible: 'Potty: little and often'
- assertNotVisible:
    id: learn.audio
- assertNotVisible:
    id: learn.audio.play
- scrollUntilVisible:
    element:
      id: learn.sources.toggle
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: learn.sources.toggle
- scrollUntilVisible:
    element:
      text: RSPCA.*
    direction: DOWN
    visibilityPercentage: 100
- assertVisible: RSPCA.*
- assertNotVisible:
    id: learn.audio
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: nav.open
- tapOn:
    id: nav.timeline
- assertNotVisible:
    id: learn.audio
