appId: com.patrickchin.puptime
name: iOS CSV picker cancellation preserves activity
tags:
  - ios
  - recovery
---
- launchApp:
    permissions: {}
    clearState: true
- runFlow: ../helpers/skip-onboarding.yaml
- extendedWaitUntil:
    visible:
      id: quick.pee
    timeout: 90000
- tapOn:
    id: quick.pee
    retryTapIfNoChange: true
- tapOn:
    id: nav.open
- tapOn:
    id: nav.insights
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: insights.frequency.pee
      text: .*1\.0.*
    timeout: 30000
- assertNotVisible:
    id: toast
- tapOn:
    id: nav.open
- tapOn:
    id: nav.settings
- scrollUntilVisible:
    element:
      id: settings.import
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: settings.import
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: ^(Cancel|Close|取消|关闭|Cancelar|Cerrar)$
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          text: ^(Cancel|Close|取消|关闭|Cancelar|Cerrar)$
          retryTapIfNoChange: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: ^(Recent|Downloads|Documents|最近|Recientes)$
          timeout: 30000
      - pressKey: Back
- extendedWaitUntil:
    visible:
      id: settings.import
      enabled: true
    timeout: 30000
- assertVisible:
    id: settings.export
    enabled: true
- tapOn:
    id: settings.back
- assertVisible:
    id: insights.frequency.pee
    text: .*1\.0.*
- stopApp
- launchApp:
    permissions: {}
- extendedWaitUntil:
    visible:
      id: nav.open
    timeout: 90000
- tapOn:
    id: nav.open
- tapOn:
    id: nav.insights
    retryTapIfNoChange: true
- assertVisible:
    id: insights.frequency.pee
    text: .*1\.0.*
