appId: com.patrickchin.puptime
name: iOS log CRUD, undo, and persistence
tags:
  - ios
  - critical
---
- launchApp:
    clearState: true
- runFlow: ../helpers/skip-onboarding.yaml
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: quick.pee
- assertVisible:
    id: toast
- tapOn:
    id: toast.undo
- scrollUntilVisible:
    element:
      id: history.empty
    direction: DOWN
    visibilityPercentage: 50
- assertVisible:
    id: history.empty
- scrollUntilVisible:
    element:
      id: quick.meal
    direction: UP
    visibilityPercentage: 50
- tapOn:
    id: quick.meal
- tapOn:
    id: toast.note
- assertVisible:
    id: editor
- scrollUntilVisible:
    element:
      id: editor.note.input
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: editor.note.input
- eraseText
- setClipboard: Ate after training
- pasteText
- assertVisible:
    id: editor.note.input
    text: Ate after training
- scrollUntilVisible:
    element:
      id: editor.close
    direction: UP
    visibilityPercentage: 50
- tapOn:
    id: editor.close
- scrollUntilVisible:
    element:
      id: event.meal.edit
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: event.meal.note
    text: Ate after training
- tapOn:
    id: event.meal.edit
- tapOn:
    id: editor.type.poop
- tapOn:
    id: editor.close
- assertVisible:
    id: event.poop
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- scrollUntilVisible:
    element:
      id: event.poop
    direction: DOWN
    visibilityPercentage: 50
- assertVisible:
    id: event.poop.note
    text: Ate after training
- scrollUntilVisible:
    element:
      id: history.day.today
    direction: DOWN
    centerElement: true
- tapOn:
    id: history.day.today
- assertNotVisible:
    id: event.poop
- tapOn:
    id: history.day.today
- assertVisible:
    id: event.poop
- tapOn:
    id: event.poop.delete
    retryTapIfNoChange: true
- tapOn:
    text: ^(Cancel|取消|Cancelar)$
    retryTapIfNoChange: true
- assertVisible:
    id: event.poop
- tapOn:
    id: event.poop.delete
    retryTapIfNoChange: true
- tapOn:
    text: ^(Delete|删除|Eliminar)$
    retryTapIfNoChange: true
- assertVisible:
    id: history.empty
