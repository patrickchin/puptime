appId: com.patrickchin.puptime
name: iOS first-open notification opt in
tags:
  - ios
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- runFlow: ../helpers/first-launch-to-reminders.yaml
- scrollUntilVisible:
    element:
      id: setup.reminders.allow
    direction: DOWN
- tapOn:
    id: setup.reminders.allow
- tapOn: Allow
- assertVisible:
    id: setup.step.ready
- scrollUntilVisible:
    element:
      id: setup.finish
    direction: DOWN
- tapOn:
    id: setup.finish
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: settings.open
- scrollUntilVisible:
    element:
      id: settings.notifications.permission
    direction: DOWN
- assertVisible:
    id: settings.notifications.permission
    text: .*Allowed.*
