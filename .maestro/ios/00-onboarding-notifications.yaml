appId: com.patrickchin.puptime
name: iOS onboarding notification opt in
tags:
  - ios
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- extendedWaitUntil:
    visible:
      id: onboarding.step.0
    timeout: 90000
- tapOn:
    id: onboarding.primary
- tapOn:
    id: onboarding.primary
- tapOn:
    id: onboarding.primary
- assertVisible:
    id: onboarding.step.3
- tapOn:
    id: onboarding.notifications.allow
- tapOn: Allow
- assertVisible: Allowed
- tapOn:
    id: onboarding.primary
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: settings.open
- scrollUntilVisible:
    element:
      id: settings.notifications.permission
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: settings.notifications.permission
    text: .*Allowed.*
