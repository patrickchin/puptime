appId: com.patrickchin.puptime
name: iOS first-open notification opt in
tags:
  - ios
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- runFlow: ../helpers/first-launch-to-reminders.yaml
- scrollUntilVisible:
    element:
      id: setup.reminders.allow
    direction: DOWN
- tapOn:
    id: setup.reminders.allow
- tapOn:
    text: ^Allow$
    optional: true
- assertVisible:
    id: setup.step.ready
- scrollUntilVisible:
    element:
      id: setup.finish
    direction: DOWN
- tapOn:
    id: setup.finish
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: nav.open
- tapOn:
    id: nav.notifications
- assertVisible:
    id: screen.notifications
- assertVisible:
    id: settings.notifications.deviceDelivery
    checked: true
- assertNotVisible:
    id: settings.notifications.permission
