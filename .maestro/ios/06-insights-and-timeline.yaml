appId: com.patrickchin.puptime
name: iOS populated insights and timeline controls
tags:
  - ios
  - analytics
---
- launchApp:
    permissions: {}
    clearState: true
- runFlow: ../helpers/skip-onboarding.yaml
- extendedWaitUntil:
    visible:
      id: quick.pee
    timeout: 90000
- tapOn:
    id: quick.pee
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: event.pee.edit
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: event.pee.edit
- extendedWaitUntil:
    visible:
      id: editor
    timeout: 30000
- scrollUntilVisible:
    element:
      id: editor.note.input
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: editor.note.input
- setClipboard: Went outside after breakfast
- pasteText
- scrollUntilVisible:
    element:
      id: editor.close
    direction: UP
    visibilityPercentage: 50
- tapOn:
    id: editor.close
- scrollUntilVisible:
    element:
      id: quick.poop
    direction: UP
    visibilityPercentage: 50
- tapOn:
    id: quick.poop
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: quick.pee
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: quick.meal
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: nav.open
- tapOn:
    id: nav.insights
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: screen.insights
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: insights.frequency.pee
      text: .*2\.0.*
    timeout: 30000
- assertVisible:
    id: insights.frequency.pee
    text: .*2\.0.*
- assertVisible:
    id: insights.frequency.poop
    text: .*1\.0.*
- tapOn:
    id: nav.open
- tapOn:
    id: nav.settings
- scrollUntilVisible:
    element:
      id: settings.export
    direction: DOWN
    visibilityPercentage: 50
- assertVisible:
    id: settings.export
    enabled: true
- tapOn:
    id: settings.back
- tapOn:
    id: nav.open
- tapOn:
    id: nav.timeline
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: screen.timeline
    timeout: 30000
- assertVisible:
    id: timeline.filter.pee
- tapOn:
    id: timeline.filter.poop-meal
- tapOn:
    id: timeline.mark.point.*
- assertVisible:
    id: timeline.details.event.*
    text: .*Poop.*
- assertVisible:
    id: timeline.details.event.*
    text: .*Eat.*
- tapOn:
    id: timeline.details.close
- tapOn:
    id: timeline.filter.pee
- assertNotVisible:
    id: timeline.empty
- tapOn:
    id: timeline.mark.point.*
- assertVisible:
    id: timeline.details
- assertVisible:
    text: Log details
- assertVisible:
    id: timeline.details.event.*
    index: 0
    text: .*Pee.*
- assertVisible:
    id: timeline.details.event.*
    index: 1
    text: .*Pee.*
- assertVisible:
    id: timeline.details.date
    text: Today.*
- assertVisible:
    text: Went outside after breakfast
- assertNotVisible:
    text: App
- assertNotVisible:
    text: Widget
- tapOn:
    id: timeline.details.close
- assertNotVisible:
    id: timeline.details
- tapOn:
    id: timeline.mark.point.*
- assertVisible:
    id: timeline.details
- tapOn:
    point: 50%, 25%
- assertNotVisible:
    id: timeline.details
- swipe:
    start: 50%, 65%
    end: 50%, 85%
- assertNotVisible:
    id: timeline.details
- tapOn:
    id: timeline.filter.poop-meal
