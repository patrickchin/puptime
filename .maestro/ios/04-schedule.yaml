appId: com.patrickchin.puptime
name: iOS routine create, edit, reminder permission, and remove
tags:
  - ios
  - critical
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- runFlow: ../helpers/skip-onboarding.yaml
- extendedWaitUntil:
    visible:
      id: nav.open
    timeout: 90000
- tapOn:
    id: nav.open
- tapOn:
    id: nav.schedule
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: screen.schedule
    timeout: 30000
- scrollUntilVisible:
    element:
      id: schedule.add
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: schedule.add
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: schedule.editor
    timeout: 30000
- tapOn:
    id: schedule.editor.type.walk
- assertVisible:
    id: schedule.editor.reminder
    checked: false
- tapOn:
    id: schedule.editor.reminder
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: ^(Don.t allow|不允许|No permitir)$
- tapOn:
    text: ^(Not now|暂不|Ahora no)$
    retryTapIfNoChange: true
- assertVisible:
    id: schedule.editor.reminder
    checked: false
- scrollUntilVisible:
    element:
      id: schedule.editor.save
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: schedule.editor.save
- scrollUntilVisible:
    element:
      id: schedule.entry.walk
    direction: UP
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: schedule.entry.walk
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: schedule.editor
    timeout: 30000
- assertVisible:
    id: schedule.editor.reminder
    checked: false
- tapOn:
    id: schedule.editor.type.poop
- scrollUntilVisible:
    element:
      id: schedule.editor.save
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: schedule.editor.save
- assertVisible:
    id: schedule.entry.poop
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: nav.open
- tapOn:
    id: nav.log
    retryTapIfNoChange: true
- assertVisible:
    id: screen.today
- assertNotVisible:
    id: routine.card
- tapOn:
    id: nav.open
- tapOn:
    id: nav.schedule
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: schedule.entry.poop.remove
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 45000
- tapOn:
    id: schedule.entry.poop.remove
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: confirm.dialog
    timeout: 10000
- tapOn:
    id: confirm.cancel
    retryTapIfNoChange: true
- assertVisible:
    id: schedule.entry.poop
- tapOn:
    id: schedule.entry.poop.remove
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: confirm.dialog
    timeout: 10000
- tapOn:
    id: confirm.delete
    retryTapIfNoChange: true
- assertNotVisible:
    id: schedule.entry.poop
- assertVisible:
    id: screen.schedule
