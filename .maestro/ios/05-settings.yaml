appId: com.patrickchin.puptime
name: iOS settings and preference persistence
tags:
  - ios
  - settings
---
- launchApp:
    permissions: {}
    clearState: true
- runFlow: ../helpers/skip-onboarding.yaml
- extendedWaitUntil:
    visible:
      id: settings.open
    timeout: 90000
- tapOn:
    id: settings.open
    retryTapIfNoChange: true
- assertVisible:
    id: screen.settings
- scrollUntilVisible:
    element:
      id: settings.widget.action.walk
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: settings.widget.action.pee
    text: checkbox, checked
- assertVisible:
    id: settings.widget.action.poop
    text: checkbox, checked
- assertVisible:
    id: settings.widget.action.meal
    text: checkbox, checked
- assertVisible:
    id: settings.widget.action.walk
    text: checkbox, unchecked
- tapOn:
    id: settings.widget.action.walk
- assertVisible:
    id: settings.widget.action.walk
    text: checkbox, checked
- stopApp
- launchApp:
    permissions: {}
- extendedWaitUntil:
    visible:
      id: settings.open
    timeout: 90000
- tapOn:
    id: settings.open
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: settings.widget.action.walk
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: settings.widget.action.walk
    text: checkbox, checked
- scrollUntilVisible:
    element:
      id: settings.theme.open
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: settings.theme.open
    retryTapIfNoChange: true
- assertVisible:
    id: appearance.close
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: appearance.theme.puppy-journal
- tapOn:
    id: appearance.theme.puppy-journal
- tapOn:
    id: settings.language.open
- tapOn:
    id: appearance.language.es
- assertVisible:
    id: screen.settings
- tapOn:
    id: settings.theme.open
    retryTapIfNoChange: true
- assertVisible:
    id: appearance.close
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: appearance.theme.puppy-journal
- assertVisible:
    id: appearance.theme.puppy-journal
    text: radio button, checked
- tapOn:
    id: appearance.close
- tapOn:
    id: settings.language.open
    retryTapIfNoChange: true
- assertVisible:
    id: appearance.language.es
    text: radio button, checked
- tapOn:
    id: appearance.close
- scrollUntilVisible:
    element:
      id: settings.back
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: settings.back
    retryTapIfNoChange: true
- assertVisible:
    id: screen.today
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.log
    text: Registro
    selected: true
- tapOn:
    id: nav.close
- stopApp
- launchApp:
    permissions: {}
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- assertVisible:
    id: screen.today
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.log
    text: Registro
    selected: true
- tapOn:
    id: nav.close
- tapOn:
    id: settings.open
    retryTapIfNoChange: true
- tapOn:
    id: settings.theme.open
    retryTapIfNoChange: true
- assertVisible:
    id: appearance.close
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: appearance.theme.puppy-journal
- assertVisible:
    id: appearance.theme.puppy-journal
    text: radio button, checked
- tapOn:
    id: appearance.close
- tapOn:
    id: settings.language.open
- assertVisible:
    id: appearance.language.es
    text: radio button, checked
- tapOn:
    id: appearance.close
- scrollUntilVisible:
    element:
      id: settings.widget.action.walk
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: settings.widget.action.walk
    text: checkbox, checked
