    direction: DOWN
    visibilityPercentage: 50
- swipe:
    start: 50%,70%
    end: 50%,35%
    duration: 400
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: settings.notifications.lead.15
    text: radio button, checked
- scrollUntilVisible:
    element:
      id: settings.theme.open
    direction: UP
    visibilityPercentage: 50
- tapOn:
    id: settings.theme.open
- scrollUntilVisible:
    element:
      id: appearance.theme.midnight
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: appearance.theme.midnight
- tapOn:
    id: settings.language.open
- tapOn:
    id: appearance.language.es
- assertVisible:
    id: screen.settings
- tapOn:
    id: settings.theme.open
- scrollUntilVisible:
