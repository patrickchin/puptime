appId: com.patrickchin.puptime
name: iOS settings and preference persistence
tags:
  - ios
  - settings
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: settings.open
    timeout: 90000
- tapOn:
    id: settings.open
    retryTapIfNoChange: true
- assertVisible:
    id: screen.settings
- scrollUntilVisible:
    element:
      id: settings.widget.action.walk
    direction: DOWN
    visibilityPercentage: 50
- assertVisible:
    id: settings.widget.action.pee
    text: checkbox, checked
- assertVisible:
    id: settings.widget.action.poop
    text: checkbox, checked
- assertVisible:
    id: settings.widget.action.meal
    text: checkbox, checked
- assertVisible:
    id: settings.widget.action.walk
    text: checkbox, unchecked
- tapOn:
    id: settings.widget.action.walk
- assertVisible:
    id: settings.widget.action.walk
    text: checkbox, checked
- scrollUntilVisible:
    element:
      id: settings.notifications.lead.15
    direction: DOWN
    visibilityPercentage: 50
- swipe:
    start: 50%,70%
    end: 50%,35%
    duration: 400
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: settings.notifications.lead.10
    text: radio button, checked
- tapOn:
    id: settings.notifications.lead.15
- assertVisible:
    id: settings.notifications.lead.15
    text: radio button, checked
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
