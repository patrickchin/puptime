- tapOn:
    id: appearance.close
- tapOn:
    id: settings.language.open
- assertVisible:
    id: appearance.language.es
    text: radio button, checked
- tapOn:
    id: appearance.close
- tapOn:
    id: settings.back
- assertVisible: Hoy
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- assertVisible: Hoy
- tapOn:
