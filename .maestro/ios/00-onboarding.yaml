appId: com.patrickchin.puptime
name: iOS first-open profile account choice practice and replay
tags:
  - ios
  - smoke
---
- runFlow: ../native/ios-first-launch-profile-prepare.yaml
- scrollUntilVisible:
    element:
      id: setup.profile.next
    direction: DOWN
- tapOn:
    id: setup.profile.next
- assertVisible:
    id: setup.step.account
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: setup.step.account
    timeout: 90000
- runFlow: ../native/ios-first-launch-local-walkthrough.yaml
- scrollUntilVisible:
    element:
      id: setup.finish
    direction: DOWN
- tapOn:
    id: setup.finish
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- tapOn:
    id: settings.open
- scrollUntilVisible:
    element:
      id: settings.notifications.permission
    direction: DOWN
- assertVisible:
    id: settings.notifications.permission
    text: .*Needed for reminders and confirmations.*
- scrollUntilVisible:
    element:
      id: settings.guide.open
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: settings.guide.open
- assertVisible:
    id: onboarding.step.0
- tapOn:
    id: onboarding.skip
- assertVisible:
    id: screen.settings
