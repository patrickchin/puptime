appId: com.patrickchin.puptime
name: iOS first-open completes and replays the guide
tags:
  - ios
  - smoke
---
- runFlow: ../conversational/03-skip-optional-setup.yaml
- tapOn:
    id: nav.open
    retryTapIfNoChange: true
- assertVisible:
    id: nav.drawer
- tapOn:
    id: nav.notifications
- assertVisible:
    id: screen.notifications
- assertVisible:
    id: settings.notifications.permission
    text: Allow notifications
- tapOn:
    id: nav.open
    retryTapIfNoChange: true
- assertVisible:
    id: nav.drawer
- tapOn:
    id: nav.settings
- assertVisible:
    id: screen.settings
- scrollUntilVisible:
    element:
      id: settings.guide.open
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: settings.guide.open
- assertVisible:
    id: onboarding.step.0
- tapOn:
    id: onboarding.skip
- assertVisible:
    id: screen.settings
