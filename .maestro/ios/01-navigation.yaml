appId: com.patrickchin.puptime
name: iOS navigation and empty states
tags:
  - ios
  - smoke
---
- launchApp:
    permissions: {}
    clearState: true
- runFlow: ../helpers/skip-onboarding.yaml
- extendedWaitUntil:
    visible:
      id: screen.today
    timeout: 90000
- assertVisible:
    id: quick.pee
- assertVisible:
    id: quick.poop
- assertVisible:
    id: quick.meal
- assertNotVisible:
    id: quick.pottyTrip
- assertNotVisible:
    id: quick.walk
- assertNotVisible:
    id: quick.nap
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.log
    selected: true
- tapOn:
    id: nav.timeline
- assertVisible:
    id: screen.timeline
- assertVisible:
    id: timeline.zoom.out
    enabled: false
- assertVisible:
    id: timeline.zoom.in
    enabled: true
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.timeline
    selected: true
- tapOn:
    id: nav.insights
- assertVisible:
    id: screen.insights
- tapOn:
    id: settings.open
- scrollUntilVisible:
    element:
      id: settings.export
    direction: DOWN
    visibilityPercentage: 50
- assertVisible:
    id: settings.export
    enabled: false
- tapOn:
    id: settings.back
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.insights
    selected: true
- tapOn:
    id: nav.schedule
- assertVisible:
    id: screen.schedule
- scrollUntilVisible:
    element:
      id: schedule.empty
    direction: DOWN
    visibilityPercentage: 50
- assertVisible:
    id: schedule.empty
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.schedule
    selected: true
- tapOn:
    id: nav.log
- assertVisible:
    id: screen.today
- tapOn:
    id: nav.open
- assertVisible:
    id: nav.log
    selected: true
- tapOn:
    id: nav.close
- assertNotVisible:
    id: nav.log
