appId: com.patrickchin.puptime
name: Notification allow reaches the normal app and survives Back
---
- runFlow:
    file: "../helpers/conversational/start.yaml"
    env:
      NOTIFICATIONS: "unset"
- runFlow: "../helpers/conversational/to-reminders.yaml"
- tapOn:
    id: "preview.reminders.allow"
- tapOn:
    text: "(?i)^Allow$"
- runFlow: "../helpers/conversational/skip-sharing.yaml"
- assertVisible:
    id: "preview.ready"
- assertVisible: You can change reminders in Notifications.
- waitForAnimationToEnd
- tapOn:
    id: "preview.back"
    enabled: true
- waitForAnimationToEnd
- tapOn:
    id: "preview.back"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "preview.prompt"
      text: "Set up reminders"
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: "preview.reminders.allow"
- runFlow: "../helpers/conversational/skip-sharing.yaml"
- assertVisible:
    id: "preview.ready"
- runFlow: "../helpers/conversational/finish-alone.yaml"
- tapOn:
    id: "nav.open"
- tapOn:
    id: "nav.notifications"
- assertVisible:
    id: "settings.notifications.deviceDelivery"
    checked: true
- assertNotVisible:
    id: "settings.notifications.permission"
- takeScreenshot: notification-allow-normal-app
