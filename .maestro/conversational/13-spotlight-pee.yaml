appId: com.patrickchin.puptime
name: Spotlight pee action uses real logging and persists
---
- runFlow:
    file: "../helpers/conversational/start.yaml"
    env:
      NOTIFICATIONS: "deny"
- runFlow: "../helpers/conversational/to-reminders.yaml"
- tapOn:
    id: "preview.reminders.later"
- assertVisible:
    id: "preview.ready"
- waitForAnimationToEnd
- tapOn:
    id: "preview.continue"
- assertVisible:
    id: "onboarding.spotlight"
- tapOn:
    id: "quick.pee"
- assertNotVisible:
    id: "onboarding.spotlight"
- assertVisible:
    id: "event.pee.edit"
- runFlow: "../helpers/conversational/assert-normal.yaml"
- assertVisible:
    id: "event.pee.edit"
