appId: com.patrickchin.puptime
name: Skip meal count and keep adjustable poop windows
---
- runFlow:
    file: "../helpers/conversational/start.yaml"
    env:
      NOTIFICATIONS: "deny"
- tapOn:
    id: "preview.guest"
- tapOn:
    id: "preview.skip"
- tapOn:
    id: "preview.skip"
- tapOn:
    id: "preview.skip"
- assertNotVisible:
    id: "preview.poopMealTime.0"
- tapOn:
    id: "preview.continue"
- tapOn:
    id: "preview.continue"
- assertNotVisible:
    id: "notifications.timing.meal.time"
# iOS's driver reports disabled Switches as enabled; assert their inert behavior.
- tapOn:
    id: "notifications.timing.meal.enabled"
- assertVisible:
    id: "notifications.timing.meal.enabled"
    checked: false
- assertVisible:
    id: "notifications.timing.poop.time"
- tapOn:
    id: "preview.reminders.later"
- runFlow: "../helpers/conversational/finish-alone.yaml"
- tapOn:
    id: "nav.open"
- tapOn:
    id: "nav.schedule"
- assertVisible:
    id: "screen.schedule"
- assertNotVisible:
    id: "schedule.entry.meal"
- assertVisible:
    id: "schedule.entry.poop"
