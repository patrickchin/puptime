appId: com.patrickchin.puptime
name: Notification blocked reaches the normal app and survives Back
---
- runFlow:
    file: "../helpers/conversational/start.yaml"
    env:
      NOTIFICATIONS: "deny"
- runFlow: "../helpers/conversational/to-reminders.yaml"
- runFlow:
    when:
      platform: Android
    commands:
      # Android's initial denied state can still ask again. Reach its actual
      # permanent-denial state before verifying a request cannot reopen it.
      - tapOn:
          id: preview.reminders.allow
      - tapOn:
          text: "Don.t [Aa]llow"
      - runFlow: "../helpers/conversational/skip-sharing.yaml"
      - assertVisible:
          id: preview.ready
      - tapOn:
          id: preview.back
      - waitForAnimationToEnd
      - tapOn:
          id: "preview.back"
      - tapOn:
          id: preview.reminders.allow
      - tapOn:
          text: "Don.t [Aa]llow"
          optional: true
      - runFlow: "../helpers/conversational/skip-sharing.yaml"
      - assertVisible:
          id: preview.ready
      - tapOn:
          id: preview.back
      - waitForAnimationToEnd
      - tapOn:
          id: "preview.back"
- tapOn:
    id: "preview.reminders.allow"
- runFlow: "../helpers/conversational/skip-sharing.yaml"
- assertVisible:
    id: "preview.ready"
- assertNotVisible: You can change reminders in Notifications.
- waitForAnimationToEnd
- tapOn:
    id: "preview.back"
    enabled: true
- waitForAnimationToEnd
- tapOn:
    id: "preview.back"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "preview.prompt"
      text: "Set up reminders"
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: "preview.reminders.allow"
- runFlow: "../helpers/conversational/skip-sharing.yaml"
- assertVisible:
    id: "preview.ready"
- runFlow: "../helpers/conversational/finish-alone.yaml"
- tapOn:
    id: "nav.open"
- tapOn:
    id: "nav.notifications"
- assertVisible:
    id: "settings.notifications.deviceDelivery"
    checked: false
- assertVisible:
    id: "settings.notifications.permission"
- takeScreenshot: notification-blocked-normal-app
